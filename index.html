async function semear(){
  /* Grupo por grupo, e NÃO "só se a lista estiver vazia". Quem já tinha o app
     instalado tem os grupos antigos — com a checagem por lista, um grupo novo
     nunca era criado, e a aba dele simplesmente não funcionava. Aconteceu com
     a nutrição. Vocabulário (lugares, itens) continua só na instalação nova,
     pra não ressuscitar o que ela apagou de propósito. */
  for(var i = 0; i < GRUPOS_SEMENTE.length; i++){
    var gid = "grupo-" + GRUPOS_SEMENTE[i].chave;
    var existe = false;
    S.grupos.forEach(function(x){ if(x.id === gid) existe = true; });
    if(existe) continue;
    var g = Object.assign({id:gid}, GRUPOS_SEMENTE[i]);
    await put("grupos", g); S.grupos.push(g);
  }
  if(!S.lugares.length){
    for(var j = 0; j < LUGARES_SEMENTE.length; j++){
      var lu = {id:"lugar-" + slug(LUGARES_SEMENTE[j]), nome:LUGARES_SEMENTE[j], apelidos:[]};
      await put("lugares", lu); S.lugares.push(lu);
    }
  }
  if(!S.itens.length){
    for(var k = 0; k < ITENS_SEMENTE.length; k++){
      var it = {id:"item-" + slug(ITENS_SEMENTE[k]), nome:ITENS_SEMENTE[k], apelidos:[], usos:0};
      await put("itens", it); S.itens.push(it);
    }
  }
  /* Alimento por alimento, como os grupos. Quem já tinha a tabela antiga
     recebe os que faltam sem perder nada. Em quem já existe, só os APELIDOS
     são somados — os números dela nunca são sobrescritos. */
  for(var m = 0; m < ALIMENTOS_SEMENTE.length; m++){
    var a = ALIMENTOS_SEMENTE[m];
    var aid = "alim-" + slug(a[0]);
    var jaTem = null;
    S.alimentos.forEach(function(x){ if(x.id === aid) jaTem = x; });
    if(jaTem){
      var extras = (a[6] || []).filter(function(ap){ return (jaTem.apelidos || []).indexOf(ap) < 0; });
      if(extras.length){
        jaTem.apelidos = (jaTem.apelidos || []).concat(extras);
        await put("alimentos", jaTem);
      }
      continue;
    }
    var al = {id:aid, nome:a[0], apelidos:a[6] || [],
              kcal:a[1], prot:a[2], carb:a[3], gord:a[4], porcao:a[5]};
    await put("alimentos", al); S.alimentos.push(al);
  }
}

function grupoPor(id){ var g = null; S.grupos.forEach(function(x){ if(x.id === id) g = x; }); return g; }
function grupoChave(c){ var g = null; S.grupos.forEach(function(x){ if(x.chave === c) g = x; }); return g; }

/* ==========================================================================
   VOZ
   As lições do app de irrigação valem inteiras:
   - se há reconhecimento de fala, ele fica SOZINHO com o microfone
   - no Android, contínuo trava: reinicia no onend
   ========================================================================== */
var sess = null;
function falaSuportada(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function ehMovel(){ return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || ""); }

function alternarFala(){
  if(sess){ encerrarFala(); return; }
  if(!falaSuportada()){
    toast("הדפדפן הזה לא מבין דיבור. אפשר לכתוב.");
    abrirEscrita();
    return;
  }
  iniciarEscuta();
}

function iniciarEscuta(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var sr = new SR();
  sr.lang = S.config.idioma || "he-IL";
  sr.continuous = !ehMovel();
  sr.interimResults = true;
  sr.maxAlternatives = 1;

  sess = {sr:sr, inicio:Date.now(), texto:"", parcial:"", erro:null, encerrando:false};

  sr.onresult = function(ev){
    if(!sess) return;
    var fin = "", par = "";
    for(var i = ev.resultIndex; i < ev.results.length; i++){
      var r = ev.results[i];
      if(r.isFinal) fin += r[0].transcript + " "; else par += r[0].transcript;
    }
    if(fin){ sess.texto += fin; sess.parcial = ""; } else { sess.parcial = par; }
    sess.erro = null;
    pintarFala();
  };
  sr.onerror = function(ev){
    if(!sess) return;
    sess.erro = ev.error;
    if(ev.error === "not-allowed" || ev.error === "service-not-allowed" || ev.error === "audio-capture"){
      sess.encerrando = true;
      try { sr.stop(); } catch(e){}
    }
    pintarFala();
  };
  sr.onend = function(){
    if(!sess) return;
    if(!sess.encerrando){ try { sr.start(); return; } catch(e){} }
    finalizarEscuta();
  };

  try { sr.start(); }
  catch(e){ sess = null; toast("לא הצלחתי להפעיל את המיקרופון."); return; }
  render();
}

function encerrarFala(){
  if(!sess || sess.encerrando) return;
  sess.encerrando = true;
  try { sess.sr.stop(); } catch(e){ finalizarEscuta(); }
}

function finalizarEscuta(){
  var s = sess; if(!s) return;
  sess = null;
  var texto = ((s.texto || "") + " " + (s.parcial || "")).replace(/\s+/g, " ").trim();
  render();
  if(!texto){
    toast(
      (s.erro === "not-allowed" || s.erro === "service-not-allowed")
        ? "הדפדפן לא נתן גישה למיקרופון."
      : s.erro === "network" ? "אין אינטרנט להבין דיבור עכשיו."
      : "לא שמעתי כלום. נסי שוב.");
    return;
  }
  confirmar(texto);
}

function pintarFala(){
  var box = document.getElementById("falaViva");
  if(!box || !sess) return;
  var t = (sess.texto || "").trim(), p = (sess.parcial || "").trim();
  if(sess.erro && !t && !p){
    box.innerHTML = '<span class="par">' + esc(
      sess.erro === "network" ? "אין אינטרנט…"
      : sess.erro === "no-speech" ? "לא שמעתי עדיין…"
      : "מנסה לשמוע…") + "</span>";
    return;
  }
  box.innerHTML = (t || p)
    ? esc(t) + (p ? ' <span class="par">' + esc(p) + "</span>" : "")
    : '<span class="par">דברי…</span>';
}

/* quem não tem reconhecimento de fala ainda consegue usar o app */
function abrirEscrita(){
  var ta = el("textarea");
  var w = el("div");
  var f = el("div", "f");
  f.appendChild(el("label", null, "מה לרשום?"));
  f.appendChild(ta);
  w.appendChild(f);
  abrirFolha("כתיבה", w, [
    botao("ביטול", "", fecharFolha),
    botao("המשך", "pri", function(){
      var t = ta.value.trim();
      if(!t) return;
      fecharFolha(); confirmar(t);
    })
  ]);
  setTimeout(function(){ ta.focus(); }, 260);
}

/* ==========================================================================
   FOLHA DESLIZANTE
   ========================================================================== */
function abrirFolha(titulo, corpo, pes){
  $("#shT").textContent = titulo;
  var c = $("#shC"); c.innerHTML = ""; c.appendChild(corpo);
  var p = $("#shP"); p.innerHTML = "";
  (pes || []).forEach(function(b){ p.appendChild(b); });
  $("#scrim").classList.add("on");
  $("#sheet").classList.add("on");
  c.scrollTop = 0;
}
function fecharFolha(){
  $("#scrim").classList.remove("on");
  $("#sheet").classList.remove("on");
}
$("#scrim").onclick = fecharFolha;

function botao(texto, cls, fn){
  var b = el("button", "btn " + (cls || ""), esc(texto));
  b.onclick = fn;
  return b;
}
function campo(rotulo, node, dica){
  var w = el("div", "f");
  w.appendChild(el("label", null, esc(rotulo)));
  w.appendChild(node);
  if(dica) w.appendChild(el("div", "dica", esc(dica)));
  return w;
}
function entrada(tipo, valor){
  var i = el("input"); i.type = tipo;
  if(valor != null) i.value = valor;
  return i;
}

/* ==========================================================================
   TELA DE CONFIRMAÇÃO
   Diferente do app de irrigação: aqui EDITAR O TEXTO É ROTINA, não exceção.
   A transcrição é o conteúdo, e o reconhecimento vai errar palavras que
   ninguém pode consertar automaticamente. Por isso o texto está sempre
   aberto num campo, não escondido atrás de um botão "editar".
   ========================================================================== */
function confirmar(texto){
  var ctx = {
    hoje: todayISO(), agora: nowHM(), grupos: S.grupos,
    itensCompra: S.itens, lugares: S.lugares, alimentos: S.alimentos
  };
  var rascunhos = interpretar(texto, ctx);
  telaConfirmar(texto, rascunhos);
}

function telaConfirmar(texto, rascunhos){
  var w = el("div");
  var erro = el("div", "err hide");
  w.appendChild(erro);
  w.appendChild(el("div", "fala-orig", "“" + esc(texto) + "”"));

  var toksFala = tokenizar(texto).toks;
  var lista = el("div");
  w.appendChild(lista);
  var cartoes = [];

  /* Um toque e a palavra que ele ouviu errado vira apelido do item certo.
     Foi o que mais melhorou o app de irrigação com o uso. */
  function botaoEnsinar(loja, item){
    var mj = melhorJanela(toksFala, item);
    if(!mj || mj.s >= 0.74 || mj.s < 0.3) return null;
    var palavra = mj.janela;
    var b = el("button", "ensinar");
    b.innerHTML = "ללמד: “" + esc(palavra) + "” = " + esc(item.nome);
    b.onclick = async function(){
      item.apelidos = (item.apelidos || []).concat(palavra)
        .filter(function(v, i, a){ return a.indexOf(v) === i; });
      await put(loja, item);
      toast("למדתי. בפעם הבאה אבין.");
      b.remove();
    };
    return b;
  }

  function blocoBotoes(titulo, itens, aoTocar){
    var bloco = el("div");
    bloco.appendChild(el("div", "tecido", "<span>" + esc(titulo) + "</span><i></i>"));
    var chips = el("div", "chips");
    itens.forEach(function(it){
      var c = el("button", "chip grande", esc(it.rotulo));
      c.onclick = function(){ aoTocar(it); };
      chips.appendChild(c);
    });
    bloco.appendChild(chips);
    return bloco;
  }

  function desenhar(){
    lista.innerHTML = ""; cartoes.length = 0;

    rascunhos.forEach(function(d, ix){
      var c = el("div", "card");
      cartoes[ix] = c;
      var g = d.grupoId ? grupoPor(d.grupoId) : null;

      /* --- o texto, sempre aberto pra editar --- */
      if(d.tipo === "compra"){
        var linha = el("div");
        linha.style.display = "flex"; linha.style.gap = "8px";
        var iq = entrada("number", d.qtd == null ? "" : d.qtd);
        iq.style.maxWidth = "88px"; iq.placeholder = "כמות";
        iq.oninput = function(){ d.qtd = iq.value === "" ? null : parseFloat(iq.value); };
        var ii = entrada("text", d.item);
        ii.oninput = function(){ d.item = ii.value; };
        linha.appendChild(iq); linha.appendChild(ii);
        c.appendChild(campo(g ? g.nome : "", linha));
      } else if(d.tipo === "comida"){
        var lc = el("div");
        lc.style.display = "flex"; lc.style.gap = "8px";
        var ig = entrada("number", d.gramas == null ? "" : d.gramas);
        ig.style.maxWidth = "92px";
        var inome = entrada("text", d.item);
        inome.oninput = function(){ d.item = inome.value; };
        lc.appendChild(ig); lc.appendChild(inome);
        c.appendChild(campo("גרם", lc));

        var lm = el("div");
        lm.style.display = "flex"; lm.style.gap = "8px";
        var ik = entrada("number", d.kcal == null ? "" : d.kcal);
        ik.placeholder = "קלוריות";
        var ip = entrada("number", d.prot == null ? "" : d.prot); ip.step = "0.1";
        ip.placeholder = "חלבון";
        var ib = entrada("number", d.carb == null ? "" : d.carb); ib.step = "0.1";
        ib.placeholder = "פחמימה";
        [ik, ip, ib].forEach(function(x){ x.style.minWidth = "0"; });
        lm.appendChild(ik); lm.appendChild(ip); lm.appendChild(ib);
        ik.oninput = function(){ d.kcal = ik.value === "" ? null : parseFloat(ik.value); d._mao = true; };
        ip.oninput = function(){ d.prot = ip.value === "" ? null : parseFloat(ip.value); d._mao = true; };
        ib.oninput = function(){ d.carb = ib.value === "" ? null : parseFloat(ib.value); d._mao = true; };

        /* mudar as gramas recalcula os valores — mas só enquanto ela não os
           tiver digitado à mão, senão o app apagaria o que ela corrigiu */
        ig.oninput = function(){
          var g = ig.value === "" ? null : parseFloat(ig.value);
          var al = null;
          S.alimentos.forEach(function(a){ if(a.id === d.alimentoId) al = a; });
          if(al && g && !d._mao){
            d.kcal = Math.round(al.kcal * g / 100);
            d.prot = Math.round(al.prot * g / 100 * 10) / 10;
            d.carb = Math.round(al.carb * g / 100 * 10) / 10;
            d.gord = Math.round((al.gord || 0) * g / 100 * 10) / 10;
            ik.value = d.kcal; ip.value = d.prot; ib.value = d.carb;
          }
          d.gramas = g;
        };
        c.appendChild(campo("ערכים", lm,
          d.alimentoId ? "מהטבלה — הערכה, לא מדידה"
                       : "לא מכיר את זה בדיוק"));

        /* Não conheço o alimento? Em vez de mandar ela procurar os números,
           ofereço os parecidos da tabela num toque. Digitar caloria à mão
           tem que ser a última saída, não a primeira. */
        if(!d.alimentoId){
          var perto = alimentosParecidos(d.item, 4);
          if(perto.length){
            var bl = el("div");
            bl.appendChild(el("div", "tecido", "<span>אולי התכוונת</span><i></i>"));
            var chs = el("div", "chips");
            perto.forEach(function(al){
              var ch = el("button", "chip",
                esc(al.nome + " · " + Math.round(al.kcal * (d.gramas || al.porcao) / 100)));
              ch.onclick = function(){
                d.alimentoId = al.id;
                if(!d.gramas) d.gramas = al.porcao;
                d.kcal = Math.round(al.kcal * d.gramas / 100);
                d.prot = Math.round(al.prot * d.gramas / 100 * 10) / 10;
                d.carb = Math.round(al.carb * d.gramas / 100 * 10) / 10;
                d.gord = Math.round((al.gord || 0) * d.gramas / 100 * 10) / 10;
                d._mao = false;
                desenhar();
              };
              chs.appendChild(ch);
            });
            bl.appendChild(chs);
            c.appendChild(bl);
          }
        }

        var chr = el("div", "chips");
        REFEICOES.forEach(function(rf){
          var ch = el("button", "chip" + (d.refeicao === rf.k ? " on" : ""), esc(rf.r));
          ch.onclick = function(){ d.refeicao = rf.k; desenhar(); };
          chr.appendChild(ch);
        });
        c.appendChild(chr);

      } else if(d.tipo === "gasto"){
        var lv = el("div");
        lv.style.display = "flex"; lv.style.gap = "8px";
        var iv = entrada("number", d.valor == null ? "" : d.valor);
        iv.step = "0.01"; iv.style.maxWidth = "116px";
        iv.oninput = function(){ d.valor = iv.value === "" ? null : parseFloat(iv.value); };
        var io = entrada("text", d.onde || "");
        io.placeholder = "איפה / ממי";
        io.oninput = function(){ d.onde = io.value; };
        lv.appendChild(iv); lv.appendChild(io);
        c.appendChild(campo("₪ " + (g ? g.nome : ""), lv));
      } else {
        var ta = el("textarea");
        ta.value = d.texto || "";
        ta.oninput = function(){ d.texto = ta.value; };
        c.appendChild(campo(g ? g.nome : "טקסט", ta,
          "אפשר לתקן מילים שלא נשמעו נכון"));
      }

      /* --- data e hora do compromisso --- */
      if(d.tipo === "compromisso"){
        var ld = el("div");
        ld.style.display = "flex"; ld.style.gap = "8px";
        var idt = entrada("date", d.data || todayISO());
        idt.oninput = function(){ d.data = idt.value; d.incerto = false; };
        var ihr = entrada("time", d.hora || "");
        ihr.oninput = function(){ d.hora = ihr.value; };
        ld.appendChild(idt); ld.appendChild(ihr);
        c.appendChild(campo("מתי", ld,
          d.repete === "semanal" ? "חוזר כל שבוע"
          : d.repete === "diario" ? "חוזר כל יום" : ""));

        /* Ela deu hora mas não deu dia. Perguntar é melhor que chutar:
           compromisso no dia errado é pior que compromisso não marcado. */
        if(d.incerto){
          c.appendChild(blocoBotoes("לאיזה יום?", [
            {rotulo:L.hoje,   v:todayISO()},
            {rotulo:L.amanha, v:somarDias(todayISO(), 1)},
            {rotulo:DIA_NOME[diaSemana(somarDias(todayISO(), 2))], v:somarDias(todayISO(), 2)}
          ], function(o){ d.data = o.v; d.incerto = false; desenhar(); }));
        }
      }

      /* --- data do lançamento --- */
      if(d.tipo === "gasto"){
        var idd = entrada("date", d.data || todayISO());
        idd.oninput = function(){ d.data = idd.value; };
        c.appendChild(campo("מתי", idd));

        /* Sinal trocado erra o mês em dobro. Nunca chutar. */
        if(!d.direcao){
          c.appendChild(blocoBotoes("יצא או נכנס?", [
            {rotulo:"יצא",   v:"saiu"},
            {rotulo:"נכנס", v:"entrou"}
          ], function(o){ d.direcao = o.v; desenhar(); }));
        } else {
          var tag = el("div", "chips");
          var ch = el("button", "chip on",
            d.direcao === "saiu" ? "יצא" : "נכנס");
          ch.onclick = function(){ d.direcao = (d.direcao === "saiu" ? "entrou" : "saiu"); desenhar(); };
          tag.appendChild(ch);
          c.appendChild(tag);
        }
      }

      /* --- não sei em que grupo isso vai: botões grandes, e aprende --- */
      if(!d.grupoId){
        c.appendChild(blocoBotoes("לאיזו קבוצה?",
          S.grupos.map(function(gg){ return {rotulo:gg.nome, v:gg}; }),
          function(o){
            /* Nutrição e compras não são só "mudar o rótulo": a fala precisa
               ser relida com o parser daquele grupo, senão "חצי אבוקדו ופרוסת
               לחם" viraria UMA anotação de texto em vez de dois alimentos com
               porção e valores. */
            var comp = o.v.comportamento;
            if(comp === "nutricao" || comp === "lista"){
              var tk2 = tokenizar(texto);
              var novos = (comp === "nutricao")
                ? lerComidas(tk2.toks, tk2.orig, 0, S.alimentos)
                : lerCompras(tk2.toks, tk2.orig, 0, S.itens);
              if(novos.length){
                rascunhos.length = 0;
                novos.forEach(function(x){
                  if(comp === "nutricao"){
                    var al = x.alimento;
                    rascunhos.push({tipo:"comida", grupoId:o.v.id, item:x.item,
                      alimentoId:x.alimentoId, gramas:x.gramas,
                      kcal: al ? Math.round(al.kcal * x.gramas / 100) : null,
                      prot: al ? Math.round(al.prot * x.gramas / 100 * 10)/10 : null,
                      carb: al ? Math.round(al.carb * x.gramas / 100 * 10)/10 : null,
                      gord: al ? Math.round((al.gord||0) * x.gramas / 100 * 10)/10 : null,
                      refeicao: refeicaoDe(nowHM()), data: todayISO(), fala: texto});
                  } else {
                    rascunhos.push({tipo:"compra", grupoId:o.v.id, item:x.item,
                      qtd:x.qtd, unidade:x.unidade, comprado:false, fala:texto});
                  }
                });
                desenhar();
                return;
              }
            }
            d.grupoId = o.v.id;
            d.tipo = comp === "lista" ? "compra"
                   : comp === "financeiro" ? "gasto"
                   : comp === "agenda" ? "compromisso"
                   : comp === "nutricao" ? "comida" : "nota";
            if((d.tipo === "compra" || d.tipo === "comida") && !d.item) d.item = d.texto;
            if(d.tipo === "comida" && !d.refeicao) d.refeicao = refeicaoDe(nowHM());
            d._ensinarGrupo = o.v;
            desenhar();
          }));
      } else if(d._ensinarGrupo){
        var bg = botaoEnsinar("grupos", d._ensinarGrupo);
        if(bg) c.appendChild(bg);
      }

      if(rascunhos.length > 1){
        var rm = el("button", "chip");
        rm.textContent = "הסר";
        rm.style.marginTop = "10px";
        rm.onclick = function(){ rascunhos.splice(ix, 1); desenhar(); };
        c.appendChild(rm);
      }
      lista.appendChild(c);
    });

    if(!rascunhos.length) lista.appendChild(el("div", "vazio", "אין מה לשמור"));
  }
  desenhar();

  function cobrar(ix, msg){
    erro.textContent = msg; erro.classList.remove("hide");
    var c = cartoes[ix];
    if(c){
      c.classList.add("pisca");
      c.scrollIntoView({block:"center", behavior:"smooth"});
      setTimeout(function(){ c.classList.remove("pisca"); }, 2200);
    }
  }

  async function salvar(){
    for(var i = 0; i < rascunhos.length; i++){
      var d = rascunhos[i];
      if(!d.grupoId) return cobrar(i, "חסרה קבוצה — בחרי אחת.");
      if(d.tipo === "gasto"){
        if(d.valor == null || isNaN(d.valor)) return cobrar(i, "חסר סכום.");
        if(!d.direcao) return cobrar(i, "יצא או נכנס? בחרי.");
      }
      if(d.tipo === "compra" && !String(d.item || "").trim()) return cobrar(i, "חסר שם למוצר.");
      /* comida sem valores PODE ser salva: melhor registrar sem número do que
         inventar um. O total do dia avisa quantos itens ficaram sem valor. */
      if(d.tipo === "comida" && !String(d.item || "").trim()) return cobrar(i, "חסר שם למאכל.");
      if(d.tipo === "nota" && !String(d.texto || "").trim()) return cobrar(i, "אין טקסט.");
      if(d.tipo === "compromisso" && !d.data) return cobrar(i, "חסר תאריך.");
    }

    for(var j = 0; j < rascunhos.length; j++){
      var r = Object.assign({}, rascunhos[j]);
      Object.keys(r).forEach(function(k){ if(k[0] === "_") delete r[k]; });
      r.id = uid();
      r.criadoEm = new Date().toISOString();
      if(r.tipo === "compra"){
        r.comprado = false;
        await lembrarItem(r.item);
      }
      if(r.tipo === "gasto" && r.onde) await lembrarLugar(r.onde);
      if(r.tipo === "comida") await lembrarAlimento(r);
      await put("notas", r);
      S.notas.push(r);
    }
    fecharFolha(); render();
    toast(rascunhos.length === 1
      ? "נשמר"
      : "נשמרו " + rascunhos.length);
  }

  abrirFolha("בדקי מה הבנתי", w, [
    botao("ביטול", "", function(){ fecharFolha(); render(); }),
    botao("שמירה", "pri", salvar)
  ]);
}

/* a lista de compras aprende sozinha: tudo que ela compra entra no
   vocabulário e melhora o reconhecimento da próxima vez */
async function lembrarItem(nome){
  nome = String(nome || "").trim();
  if(!nome) return;
  var achou = acharNaLista(tokenizar(nome).toks, S.itens, 0.85);
  if(achou){ achou.item.usos = (achou.item.usos || 0) + 1; await put("itens", achou.item); return; }
  var novo = {id:"item-" + slug(nome), nome:nome, apelidos:[], usos:1};
  await put("itens", novo); S.itens.push(novo);
}
/* alimento que eu não conhecia e ela informou: guarda por 100 g, e nunca
   mais pergunta. É o "Ensinar" da nutrição. */
/* os alimentos da tabela mais parecidos com o que ela falou — usados nos
   botões de "aולי התכוונת". Limiar baixo de propósito: aqui errar é barato,
   porque ela vê o nome e o número antes de tocar. */
function alimentosParecidos(texto, quantos){
  var toks = tokenizar(String(texto || "")).toks;
  if(!toks.length) return [];
  var notas = [];
  S.alimentos.forEach(function(al){
    var mj = melhorJanela(toks, al);
    if(mj && mj.s >= 0.42) notas.push({al:al, s:mj.s});
  });
  notas.sort(function(a, b){ return b.s - a.s; });
  return notas.slice(0, quantos || 4).map(function(x){ return x.al; });
}

async function lembrarAlimento(r){
  if(r.alimentoId || !r.gramas || r.kcal == null) return;
  var nome = String(r.item || "").trim();
  if(!nome) return;
  var f = r.gramas ? (100 / r.gramas) : 1;
  var novo = {
    id:"alim-" + slug(nome), nome:nome, apelidos:[],
    kcal: Math.round((r.kcal || 0) * f),
    prot: Math.round((r.prot || 0) * f * 10) / 10,
    carb: Math.round((r.carb || 0) * f * 10) / 10,
    gord: Math.round((r.gord || 0) * f * 10) / 10,
    porcao: r.gramas
  };
  await put("alimentos", novo);
  S.alimentos = S.alimentos.filter(function(a){ return a.id !== novo.id; });
  S.alimentos.push(novo);
}

async function lembrarLugar(nome){
  nome = String(nome || "").trim();
  if(!nome || nome.length < 2) return;
  var achou = acharNaLista(tokenizar(nome).toks, S.lugares, 0.85);
  if(achou) return;
  var novo = {id:"lugar-" + slug(nome), nome:nome, apelidos:[]};
  await put("lugares", novo); S.lugares.push(novo);
}

/* ---- compromissos ordenados ---- */
function compromissos(){
  return S.notas.filter(function(n){ return n.tipo === "compromisso"; })
    .sort(function(a, b){
      var x = (a.data || "") + (a.hora || "99:99");
      var y = (b.data || "") + (b.hora || "99:99");
      return x < y ? -1 : x > y ? 1 : 0;
    });
}
/* repetição semanal: mostra a próxima ocorrência a partir de hoje */
function ocorrenciaEm(n, iso){
  if(!n.repete) return n.data === iso;
  if(n.repete === "diario") return iso >= n.data;
  return iso >= n.data && diaSemana(iso) === n.diaRepete;
}
function doDia(iso){
  return compromissos().filter(function(n){ return ocorrenciaEm(n, iso); });
}

function telaHoje(){
  var hoje = todayISO();
  cabecalho(L.hoje, fmtDataLonga(hoje), SVG_SOL);
  var v = el("div");

  /* --- o arco: o próximo compromisso --- */
  var prox = null;
  for(var k = 0; k < 8 && !prox; k++){
    var iso = somarDias(hoje, k);
    var lista = doDia(iso).filter(function(n){
      if(iso > hoje) return true;
      var m = minutosAte(iso, n.hora);
      return m === null || m > -30;
    });
    if(lista.length) prox = {n:lista[0], iso:iso};
  }
  var arco = el("div", "arco" + (prox ? "" : " calmo"));
  if(prox){
    var min = minutosAte(prox.iso, prox.n.hora);
    var quando = (min !== null && fmtDaqui(min)) || fmtDia(prox.iso);
    arco.innerHTML =
      '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--terracota)" stroke-width="1.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.4V12l3.1 1.9"/></svg>' +
      '<div class="quando">' + esc(quando) + "</div>" +
      '<div class="oque serif">' + esc(prox.n.texto) + "</div>" +
      '<div class="hora num">' + esc(prox.n.hora || "") + "</div>";
  } else {
    arco.innerHTML =
      '<svg width="42" height="30" viewBox="0 0 42 30" fill="none" stroke="var(--ocre)" stroke-width="1.15" stroke-linecap="round">' +
      '<path d="M9 24a12 12 0 0 1 24 0"/><path d="M14 24a7 7 0 0 1 14 0"/>' +
      '<path d="M21 3v4M6 12l2.4 2.4M36 12l-2.4 2.4M2 24h5M35 24h5"/></svg>' +

  }
  v.appendChild(arco);
  v.appendChild(el("div", "franja"));
  v.appendChild(blocoMic());

  /* --- atalho de sonho: um toque, sem escolher nada --- */
  var atalhos = el("div", "chips");
  atalhos.style.justifyContent = "center";
  var bs = el("button", "chip", "חלמתי…");
  bs.onclick = function(){ aba = "notas"; subAba = "sonhos"; render(); setTimeout(alternarFala, 120); };
  atalhos.appendChild(bs);
  var bw = el("button", "chip" + (subAba === "semana" ? " on" : ""), L.semana);
  bw.onclick = function(){ subAba = (subAba === "semana" ? "" : "semana"); render(); };
  atalhos.appendChild(bw);
  v.appendChild(atalhos);

  if(subAba === "semana"){
    /* a semana começa no DOMINGO */
    var ini = somarDias(hoje, -diaSemana(hoje));
    for(var i = 0; i < 7; i++){
      var d = somarDias(ini, i);
      var itens = doDia(d);
      v.appendChild(el("div", "tecido",
        "<span>" + esc(DIA_NOME[diaSemana(d)] + " · " + fmtDiaCurto(d)) + "</span><i></i>"));
      if(!itens.length){ v.appendChild(el("div", "vazio", "—")); continue; }
      itens.forEach(function(n){ v.appendChild(linhaCompromisso(n, d)); });
    }
  } else {
    v.appendChild(el("div", "tecido", "<span>" + esc(L.hoje) + "</span><i></i>"));
    var ah = doDia(hoje);
    if(!ah.length) v.appendChild(el("div", "vazio", "אין כלום היום"));
    ah.forEach(function(n){ v.appendChild(linhaCompromisso(n, hoje)); });

    var am = somarDias(hoje, 1), lam = doDia(am);
    if(lam.length){
      v.appendChild(el("div", "tecido", "<span>" + esc(L.amanha) + "</span><i></i>"));
      lam.forEach(function(n){ v.appendChild(linhaCompromisso(n, am)); });
    }
  }
  return v;
}

function linhaCompromisso(n, iso){
  var b = el("button", "item");
  var min = minutosAte(iso, n.hora);
  if(min !== null && min <= 0) b.classList.add("feito");
  else if(min !== null && min < 60) b.classList.add("agora");
  b.appendChild(el("div", "p"));
  b.appendChild(el("div", "h num", esc(n.hora || "—")));
  b.appendChild(el("div", "t", esc(n.texto) +
    (n.repete ? '<small>חוזר</small>' : "")));
  b.onclick = function(){ verNota(n); };
  return b;
}

/* ---------- קניות: uma lista só ---------- */
function telaCompras(){
  var g = grupoChave("compras");
  cabecalho(g ? g.nome : "", "", SVG_CESTA);
  var v = el("div");
  v.appendChild(blocoMic());

  var lista = S.notas.filter(function(n){ return n.tipo === "compra" && !n.arquivado; });
  var aComprar = lista.filter(function(n){ return !n.comprado; });
  var jaComprado = lista.filter(function(n){ return n.comprado; });

  function linha(n){
    var b = el("button", "item" + (n.comprado ? " feito" : ""));
    b.appendChild(el("div", "p"));
    b.appendChild(el("div", "t", esc(n.item) +
      (n.qtd ? ' <small class="num">' + esc(fmtNum(n.qtd) + (n.unidade ? " " + n.unidade : "")) + "</small>" : "")));
    /* marcar como comprado é um toque na linha inteira — ela vai fazer isso

    b.onclick = async function(){
      n.comprado = !n.comprado;
      await put("notas", n);
      render();

  }

  v.appendChild(el("div", "tecido", "<span>לקנות</span><i></i>"));

  if(jaComprado.length){
    v.appendChild(el("div", "tecido", "<span>נקנה</span><i></i>"));
    jaComprado.forEach(function(n){ v.appendChild(linha(n)); });

    /* sem isto a lista vira lixo em duas semanas */
    var fim = el("div", "linha-btn");

      for(var i = 0; i < jaComprado.length; i++){

        await put("notas", jaComprado[i]);
      }
      render();

         então perguntamos, nunca inventamos. */
      perguntarGasto();
    }));
    v.appendChild(fim);
  }

  /* os de sempre: economiza mais fala que qualquer reconhecimento bom */
  var usuais = S.itens.filter(function(it){ return (it.usos || 0) > 0; })
    .sort(function(a, b){ return (b.usos || 0) - (a.usos || 0); })
    .filter(function(it){
      /* nem o que falta comprar, nem o que já foi posto no carrinho hoje */
      return !lista.some(function(n){ return normHe(n.item) === normHe(it.nome); });
    }).slice(0, 10);

/* ---------- כספים: o mês ---------- */
function telaDinheiro(){
  var g = grupoChave("dinheiro");
  var mes = S.config.mes || todayISO().slice(0, 7);
  var pm = mes.split("-").map(Number);
  cabecalho(g ? g.nome : "", MES_NOME[pm[1]-1] + " " + pm[0], SVG_CIFRA);
  var v = el("div");

  var nav = el("div", "mesnav");
  /* Em RTL a leitura corre da direita pra esquerda: VOLTAR fica à direita,
     AVANÇAR à esquerda. O primeiro filho do flex é o da direita. */
  var bAnt = el("button"); bAnt.innerHTML = "›";        /* volta um mês */
  bAnt.onclick = function(){ S.config.mes = mesSomar(mes, -1); render(); };
  var bProx = el("button"); bProx.innerHTML = "‹";      /* avança um mês */
  bProx.onclick = function(){ S.config.mes = mesSomar(mes, 1); render(); };
  var rot = el("div", "serif", esc(MES_NOME[pm[1]-1] + " " + pm[0]));
  rot.style.fontSize = "18px";
  nav.appendChild(bAnt); nav.appendChild(rot); nav.appendChild(bProx);
  v.appendChild(nav);

  var lista = S.notas.filter(function(n){
    return n.tipo === "gasto" && String(n.data || "").slice(0, 7) === mes;
  }).sort(function(a, b){ return (b.data || "") < (a.data || "") ? -1 : 1; });

  var entrou = 0, saiu = 0;
  lista.forEach(function(n){
    if(n.direcao === "entrou") entrou += (n.valor || 0); else saiu += (n.valor || 0);
  });

  var tiles = el("div", "tiles");
  tiles.innerHTML =
    '<div class="tile"><div class="r">נכנס</div><div class="v serif num e">' + shekel(entrou) + "</div></div>" +
    '<div class="tile saldo"><div class="r">מאזן</div><div class="v serif num">' + shekel(entrou - saiu) + "</div></div>" +
    '<div class="tile"><div class="r">יצא</div><div class="v serif num s">' + shekel(saiu) + "</div></div>";
  v.appendChild(tiles);

  v.appendChild(blocoMic());

  if(!lista.length){
    v.appendChild(el("div", "vazio", "אין תנועות בחודש הזה"));
  } else {
    var diaAtual = null;
    lista.forEach(function(n){
      if(n.data !== diaAtual){
        diaAtual = n.data;
        v.appendChild(el("div", "tecido", "<span>" + esc(fmtDia(n.data)) + "</span><i></i>"));
      }
      var b = el("button", "lanc");
      var ent = n.direcao === "entrou";
      b.appendChild(el("div", "seta " + (ent ? "e" : "s"), ent ? "↑" : "↓"));
      b.appendChild(el("div", "onde", esc(n.onde || (grupoPor(n.grupoId) || {}).nome || "")));
      b.appendChild(el("div", "val num" + (ent ? " e" : ""), shekel(n.valor)));
      b.onclick = function(){ verNota(n); };
      v.appendChild(b);
    });

    /* quebra por lugar */
    var porOnde = {};
    lista.forEach(function(n){
      if(n.direcao === "entrou") return;
      var chave = normHe(n.onde || "—");
      if(!porOnde[chave]) porOnde[chave] = {nome:n.onde || "—", total:0};
      porOnde[chave].total += (n.valor || 0);
    });
    var arr = Object.keys(porOnde).map(function(k){ return porOnde[k]; })
      .sort(function(a, b){ return b.total - a.total; }).slice(0, 6);
    if(arr.length){
      v.appendChild(el("div", "tecido", "<span>לפי מקום</span><i></i>"));
      var maior = arr[0].total || 1;
      arr.forEach(function(x){
        var bb = el("div", "barra");
        bb.innerHTML = '<div class="l"><span>' + esc(x.nome) + '</span><b class="num">' + shekel(x.total) + "</b></div>" +
          '<div class="g"><i style="width:' + Math.round(x.total / maior * 100) + '%"></i></div>';
        v.appendChild(bb);
      });
    }
  }
  return v;
}
function mesSomar(mes, n){
  var p = mes.split("-").map(Number);
  var d = new Date(p[0], p[1] - 1 + n, 1);
  return d.getFullYear() + "-" + p2(d.getMonth() + 1);
}

    var tot = 0, tem = false;
    S.notas.forEach(function(n){
      if(n.tipo === "comida" && n.data === d7 && n.kcal != null){ tot += n.kcal; tem = true; }

    var c7 = el("div", "card");

    c7.appendChild(el("div", "dica", "\u05E2\u05DC \u05E4\u05E0\u05D9 " + n7 + " \u05D9\u05DE\u05D9\u05DD \u05E9\u05E0\u05E8\u05E9\u05DE\u05D5"));
    v.appendChild(c7);

  /* a honestidade fica na tela, não só na conversa */

  v.appendChild(nota);

  return v;
}

/* ==========================================================================
   COFRE DE SENHAS (סיסמאות)
   Cifrado de verdade, não escondido atrás de uma tela.

   A senha mestra NÃO é guardada em lugar nenhum. Dela nasce a chave
   (PBKDF2, 310 mil voltas), e a chave vive SÓ nesta variável, em memória.
   Fecha o app, troca de aba, passa o tempo — a chave some e o conteúdo
   volta a ser letra sem sentido, inclusive dentro do arquivo de backup.

   Esqueceu a senha mestra: acabou. Não existe recuperação, e é exatamente
   isso que faz disto um cofre. O aviso está na tela de criação.
   ========================================================================== */
var COFRE_ITERS = 310000, COFRE_SELO = "MAYA-COFRE-OK", COFRE_MINUTOS = 3;
var PRF_SAL = "maya-cofre-prf-v1";

var _cofreChave = null;   /* a chave. NUNCA vai pro banco nem pro backup. */
var _cofreLista = null;   /* as entradas decifradas, só enquanto aberto */
var _cofreRelogio = null;
var _cofreBusca = "";

var _te = new TextEncoder(), _td = new TextDecoder();

function cB64(b){
  var s = "", a = new Uint8Array(b);
  for(var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
  return btoa(s);
}
function cDeB64(t){
  var s = atob(t), a = new Uint8Array(s.length);
  for(var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}
function cAleat(n){ return crypto.getRandomValues(new Uint8Array(n)); }

async function cDerivar(senha, sal, iters){
  var base = await crypto.subtle.importKey("raw", _te.encode(senha), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:sal, iterations:iters, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
}
async function cCifrar(chave, texto){
  var iv = cAleat(12);
  var ct = await crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, chave, _te.encode(texto));
  return {iv:cB64(iv), ct:cB64(ct)};
}
async function cDecifrar(chave, p){
  var claro = await crypto.subtle.decrypt({name:"AES-GCM", iv:cDeB64(p.iv)}, chave, cDeB64(p.ct));
  return _td.decode(claro);
}

async function cofreCriar(senha){
  var sal = cAleat(16);
  var chave = await cDerivar(senha, sal, COFRE_ITERS);
  var reg = {id:"cofre", v:1, sal:cB64(sal), iters:COFRE_ITERS,
             selo: await cCifrar(chave, COFRE_SELO),
             dados: await cCifrar(chave, "[]"),
             bio:null, criado:Date.now()};
  await put("cofre", reg);
  S.cofre = reg; _cofreChave = chave; _cofreLista = [];
  cofreRearmar();
}

/* O selo é um texto conhecido cifrado com a chave. Se ele não abre, a senha
   está errada — e o AES-GCM garante isso sem tocar nas entradas. */
async function cofreAbrir(senha){
  var reg = S.cofre;
  var chave = await cDerivar(senha, cDeB64(reg.sal), reg.iters || COFRE_ITERS);
  try {
    if((await cDecifrar(chave, reg.selo)) !== COFRE_SELO) throw new Error("x");
  } catch(e){ throw new Error("errada"); }
  _cofreChave = chave;
  _cofreLista = JSON.parse(await cDecifrar(chave, reg.dados));
  cofreRearmar();
}

async function cofreGravar(){
  S.cofre.dados = await cCifrar(_cofreChave, JSON.stringify(_cofreLista));
  S.cofre.mexido = Date.now();
  await put("cofre", S.cofre);
  cofreRearmar();
}

async function cofreTrocarSenha(velha, nova){
  var reg = S.cofre;
  var chaveV = await cDerivar(velha, cDeB64(reg.sal), reg.iters || COFRE_ITERS);
  try {
    if((await cDecifrar(chaveV, reg.selo)) !== COFRE_SELO) throw new Error("x");
  } catch(e){ throw new Error("errada"); }
  var lista = JSON.parse(await cDecifrar(chaveV, reg.dados));
  var sal = cAleat(16);
  var chaveN = await cDerivar(nova, sal, COFRE_ITERS);
  reg.sal = cB64(sal); reg.iters = COFRE_ITERS;
  reg.selo  = await cCifrar(chaveN, COFRE_SELO);
  reg.dados = await cCifrar(chaveN, JSON.stringify(lista));
  reg.bio = null;            /* a digital embrulhava a chave velha */
  reg.mexido = Date.now();
  await put("cofre", reg);
  S.cofre = reg; _cofreChave = chaveN; _cofreLista = lista;
  cofreRearmar();
}

function cofreTrancar(){
  _cofreChave = null; _cofreLista = null; _cofreBusca = "";
  clearTimeout(_cofreRelogio);
}
function cofreAberto(){ return !!_cofreChave; }
function cofreRearmar(){
  clearTimeout(_cofreRelogio);
  _cofreRelogio = setTimeout(function(){
    if(_cofreChave){
      cofreTrancar();
      if(aba === "mais" && subAba === "cofre") render();
    }
  }, COFRE_MINUTOS * 60000);
}
/* sai da tela, tranca. Celular na mesa não é celular guardado. */
document.addEventListener("visibilitychange", function(){
  if(document.hidden) cofreTrancar();
});

/* ---------- gerador ----------
   Aleatoriedade do sistema, sem viés (o resto do módulo seria viés), e sem
   os caracteres que ninguém distingue à mão: l I O 0 1. */
var C_MIN = "abcdefghijkmnopqrstuvwxyz";
var C_MAI = "ABCDEFGHJKLMNPQRSTUVWXYZ";
var C_NUM = "23456789";
var C_SIM = "!@#$%&*?-_=+";
function cSorteio(lim){
  var teto = Math.floor(256 / lim) * lim, n;
  do { n = cAleat(1)[0]; } while(n >= teto);
  return n % lim;
}
function cGerar(tam, comSimbolos){
  var g = [C_MIN, C_MAI, C_NUM];
  if(comSimbolos !== false) g.push(C_SIM);
  var todosC = g.join(""), s = [];
  g.forEach(function(x){ s.push(x[cSorteio(x.length)]); });
  while(s.length < tam) s.push(todosC[cSorteio(todosC.length)]);
  for(var i = s.length - 1; i > 0; i--){
    var j = cSorteio(i + 1), t = s[i]; s[i] = s[j]; s[j] = t;
  }
  return s.join("");
}

/* ---------- biometria ----------
   A digital NÃO decifra nada por si: ela autentica. O que serve é a extensão
   PRF do WebAuthn, que devolve um segredo estável — e com ele embrulhamos a
   chave do cofre. Se o Chrome do aparelho não tiver PRF, isto FALHA e o app
   volta pra senha digitada. Detectado, nunca suposto: não dá pra testar
   biometria fora de um celular de verdade. */
function bioPossivel(){
  return !!(window.PublicKeyCredential && navigator.credentials &&
            navigator.credentials.create && location.protocol === "https:");
}
async function bioSegredo(rawId){
  var r = await navigator.credentials.get({publicKey:{
    challenge: cAleat(32),
    allowCredentials: rawId ? [{type:"public-key", id:rawId}] : [],
    userVerification: "required",
    timeout: 60000,
    extensions:{prf:{eval:{first:_te.encode(PRF_SAL)}}}
  }});
  if(!r) return null;
  var x = r.getClientExtensionResults();
  if(!x || !x.prf || !x.prf.results || !x.prf.results.first) return null;
  return new Uint8Array(x.prf.results.first);
}
async function bioLigar(){
  if(!_cofreChave) throw new Error("fechado");
  var cred = await navigator.credentials.create({publicKey:{
    challenge: cAleat(32),
    rp:{name:"מאיה"},
    user:{id:cAleat(16), name:"maya", displayName:"מאיה"},
    pubKeyCredParams:[{type:"public-key", alg:-7}, {type:"public-key", alg:-257}],
    authenticatorSelection:{authenticatorAttachment:"platform",
                            userVerification:"required", residentKey:"preferred"},
    timeout: 60000,
    extensions:{prf:{}}
  }});
  if(!cred) throw new Error("semprf");
  var segredo = await bioSegredo(cred.rawId);
  if(!segredo) throw new Error("semprf");
  var kek = await crypto.subtle.importKey("raw", segredo, "AES-GCM", false, ["encrypt","decrypt"]);
  var bruta = await crypto.subtle.exportKey("raw", _cofreChave);
  var iv = cAleat(12);
  var ct = await crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, kek, bruta);
  S.cofre.bio = {cred:cB64(cred.rawId), iv:cB64(iv), ct:cB64(ct)};
  await put("cofre", S.cofre);
}
async function bioAbrir(){
  var b = S.cofre && S.cofre.bio;
  if(!b) throw new Error("sem");
  var segredo = await bioSegredo(cDeB64(b.cred));
  if(!segredo) throw new Error("semprf");
  var kek = await crypto.subtle.importKey("raw", segredo, "AES-GCM", false, ["encrypt","decrypt"]);
  var bruta = await crypto.subtle.decrypt({name:"AES-GCM", iv:cDeB64(b.iv)}, kek, cDeB64(b.ct));
  _cofreChave = await crypto.subtle.importKey("raw", bruta, "AES-GCM", true, ["encrypt","decrypt"]);
  _cofreLista = JSON.parse(await cDecifrar(_cofreChave, S.cofre.dados));
  cofreRearmar();
}

  lb.appendChild(botao("יבוא", "", importar));
  c4.appendChild(lb);
  c4.appendChild(el("div", "dica",
    "הכל נשמר רק במכשיר הזה. סנכרון מוצפן יגיע בשלב הבא."));
  v.appendChild(c4);

  var c5 = el("div", "card");
  var bt = botao("מצב לילה / יום", "", async function(){
    var n = !(S.config.noite);
    await salvarCfg({noite:n, noiteAuto:false});
    aplicarTema(); render();
  });
  c5.appendChild(bt);
  v.appendChild(c5);
  return v;
}

function verNota(n){
  var w = el("div");
  var g = grupoPor(n.grupoId);
  if(n.fala) w.appendChild(el("div", "fala-orig", "“" + esc(n.fala) + "”"));

  if(n.tipo === "compromisso"){
    var it = entrada("text", n.texto); w.appendChild(campo("מה", it));
    var idt = entrada("date", n.data); w.appendChild(campo("מתי", idt));
    var ihr = entrada("time", n.hora || ""); w.appendChild(campo("שעה", ihr));
    var salvarFn = async function(){
      n.texto = it.value; n.data = idt.value; n.hora = ihr.value;
      await put("notas", n); fecharFolha(); render(); toast("עודכן");
    };
    abrirFolha(g ? g.nome : "", w, [rodapeApagar(n), botao("שמירה", "pri", salvarFn)]);
    return;
  }
  if(n.tipo === "gasto"){
    var iv = entrada("number", n.valor); iv.step = "0.01";
    w.appendChild(campo("סכום", iv));
    var io = entrada("text", n.onde || "");
    w.appendChild(campo("איפה / ממי", io));
    var idd = entrada("date", n.data); w.appendChild(campo("מתי", idd));
    abrirFolha(g ? g.nome : "", w, [rodapeApagar(n), botao("שמירה", "pri", async function(){
      n.valor = parseFloat(iv.value); n.onde = io.value; n.data = idd.value;
      await put("notas", n); fecharFolha(); render(); toast("עודכן");
    })]);
    return;
  }
  if(n.tipo === "comida"){
    var inm = entrada("text", n.item); w.appendChild(campo("מה", inm));
    var igr = entrada("number", n.gramas); w.appendChild(campo("גרם", igr));
    var ikc = entrada("number", n.kcal == null ? "" : n.kcal);
    w.appendChild(campo("קלוריות", ikc));
    abrirFolha(g ? g.nome : "", w, [rodapeApagar(n), botao("שמירה", "pri", async function(){
      n.item = inm.value; n.gramas = parseFloat(igr.value) || null;
      n.kcal = ikc.value === "" ? null : parseFloat(ikc.value);
      await put("notas", n); fecharFolha(); render(); toast("עודכן");
    })]);
    return;
  }
  var ta = el("textarea"); ta.value = n.texto || "";
  w.appendChild(campo(n.noite ? fmtNoite(n.data) : fmtDia(n.data), ta));
  abrirFolha(g ? g.nome : "", w, [rodapeApagar(n), botao("שמירה", "pri", async function(){
    n.texto = ta.value;
    await put("notas", n); fecharFolha(); render(); toast("עודכן");
  })]);
}

function rodapeApagar(n){
  return botao("מחיקה", "dng", async function(){
    await del("notas", n.id);
    S.notas = S.notas.filter(function(x){ return x.id !== n.id; });
    fecharFolha(); render(); toast("נמחק");
  });
}

/* ---------- backup ---------- */
function exportar(){
  /* alimentos e config FALTAVAM aqui: os alimentos que ela ensinou e as metas
     nao entravam no backup, e sumiam numa troca de aparelho. O cofre entra
     como esta — cifrado. Sem a senha mestra o arquivo nao revela nada. */
  var dados = {versao:2, quando:new Date().toISOString(),
    grupos:S.grupos, notas:S.notas, lugares:S.lugares, itens:S.itens,
    alimentos:S.alimentos, config:S.config,
    cofre:S.cofre ? [S.cofre] : []};
  var b = new Blob([JSON.stringify(dados, null, 1)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "maya-" + todayISO() + ".json";
  a.click();
}
function importar(){
  var i = document.createElement("input");
  i.type = "file"; i.accept = "application/json,.json";
  i.onchange = async function(){
    var f = i.files[0]; if(!f) return;
    try {
      var d = JSON.parse(await f.text());
      var lojas = ["grupos","notas","lugares","itens","alimentos","cofre"];
      if(d.config) await put("config", Object.assign({id:"app"}, d.config));
      for(var k = 0; k < lojas.length; k++){
        var arr = d[lojas[k]] || [];
        for(var j = 0; j < arr.length; j++) await put(lojas[k], arr[j]);
      }
      cofreTrancar();
      await carregar(); render();
      toast("יובא");
    } catch(e){ toast("הקובץ לא תקין"); }
  };
  i.click();
}

/* ==========================================================================
   TEMA — a noite não é outro tema, é o mesmo app depois do pôr do sol.
   A tela de sonhos abre escura de madrugada, sem perguntar.
   ========================================================================== */
function aplicarTema(){
  var h = new Date().getHours();
  var auto = (S.config.noiteAuto !== false);
  var noite = auto ? (h >= 20 || h < 7) : !!S.config.noite;
  if(aba === "notas" && subAba === "sonhos" && (h >= 20 || h < 9)) noite = true;
  document.documentElement.classList.toggle("noite", noite);
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", noite ? "#1C1714" : "#F6EFE4");
}

/* ==========================================================================
   NAVEGAÇÃO E DESENHO
   ========================================================================== */
var ABAS = [
  {k:"hoje",    r:"היום"},
  {k:"nutricao",r:"תזונה"},
  {k:"compras", r:"קניות"},
  {k:"dinheiro",r:"כספים"},
  {k:"notas",   r:"רשומות"},
  {k:"mais",    r:"עוד"}
];
function desenharNav(){
  var n = $("#nav"); n.innerHTML = "";
  ABAS.forEach(function(a){
    var b = el("button", aba === a.k ? "on" : "");
    b.appendChild(el("div", "pt"));
    b.appendChild(el("div", null, esc(a.r)));
    b.onclick = function(){ irPara(a.k); };
    n.appendChild(b);
  });
}

function render(){
  aplicarTema();
  desenharNav();
  var v = $("#view");
  v.innerHTML = "";
  var tela =
    aba === "notas"    ? telaNotas() :
    aba === "nutricao" ? telaNutricao() :
    aba === "compras"  ? telaCompras() :
    aba === "dinheiro" ? telaDinheiro() :
    (aba === "mais" && subAba === "cofre") ? telaCofre() :
    aba === "mais"     ? telaMais() : telaHoje();
  v.appendChild(tela);
  v.appendChild(el("div", "rodape-boho"));
}

async function carregar(){
  S.grupos  = await todos("grupos");
  S.notas   = await todos("notas");
  S.lugares = await todos("lugares");
  S.itens   = await todos("itens");
  S.alimentos = await todos("alimentos");
  S.cofre     = (await todos("cofre"))[0] || null;
  var cfg = await todos("config");
  S.config = cfg[0] || {id:"app"};
  S.grupos.sort(function(a, b){ return (a.ordem || 9) - (b.ordem || 9); });
}

(async function inicio(){
  try {
    await abrirDB();
    await carregar();
    await semear();
    await carregar();
  } catch(e){
    console.error(e);
    document.body.innerHTML = '<div style="padding:40px;text-align:center;line-height:1.7">' +
      '<b>לא הצלחתי לפתוח את המידע.</b><br><br>' +
      'נסי לרענן את הדף. אם זה חוזר, זו כנראה גרסה ישנה שנתקעה — ' +
      'סגרי את הכרטיסייה ופתחי מחדש.<br><br>' +
      '<small style="opacity:.7">' + esc(String(e && e.message || e)) + '</small></div>';
    return;
  }
  render();
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
  /* deixa o app testável sem microfone */
  window.__falar = function(t){ confirmar(t); };
})();
</script>
