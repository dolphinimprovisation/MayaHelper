<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6B3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Caderno de Campo</title>
<style>
:root{
  --bg:#F7F5F0; --card:#FFFFFF; --ink:#16200F; --ink2:#4A5546; --line:#DCD8CE;
  --green:#2E6B3E; --green-d:#1F4C2C; --blue:#1565A0; --amber:#B25B00;
  --purple:#5B4B8A; --red:#B3261E; --shadow:0 1px 3px rgba(0,0,0,.10),0 4px 14px rgba(0,0,0,.05);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:400 17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:84px; overscroll-behavior-y:contain;
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;width:100%}
.hide{display:none !important}

header{
  position:sticky;top:0;z-index:30;background:var(--green);color:#fff;
  padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)
}
header h1{font-size:19px;flex:1}
header .sub{font-size:13px;opacity:.85;font-weight:400;display:block;margin-top:1px}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.14)}

main{padding:16px 16px 8px}
.sec{margin-bottom:26px}
.sec-t{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--ink2);font-size:15px}

/* ---------- tela inicial ---------- */
.home{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 8px 0}
.plant{width:132px;height:132px;display:block}
.st-t{font-size:21px;font-weight:700;margin-top:2px}
.st-s{font-size:15px;color:var(--ink2);margin-top:5px;max-width:300px;line-height:1.4}
.st-t.ok{color:var(--green)} .st-t.atencao{color:var(--amber)} .st-t.atraso{color:var(--red)}

.micwrap{margin:34px 0 0}
.mic{
  width:176px;height:176px;border-radius:50%;background:var(--green);color:#fff;
  display:grid;place-items:center;box-shadow:0 6px 20px rgba(46,107,62,.34);
  transition:transform .1s, background .2s
}
.mic:active{transform:scale(.96)}
.mic.rec{background:var(--red);box-shadow:0 6px 20px rgba(179,38,30,.34);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(179,38,30,.42),0 6px 20px rgba(179,38,30,.34)}
                 60%{box-shadow:0 0 0 22px rgba(179,38,30,0),0 6px 20px rgba(179,38,30,.34)}}
.mic svg{width:66px;height:66px}
.miclb{margin-top:18px;font-size:17px;font-weight:650;color:var(--ink2)}
.mictime{font-variant-numeric:tabular-nums;color:var(--red)}
.fala-viva{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;font-size:16.5px;line-height:1.45;text-align:left;min-height:58px;width:100%;max-width:520px;box-shadow:var(--shadow)}
.fala-viva .par{color:var(--ink2)}
.fala-orig{background:var(--card);border-left:4px solid var(--green);border-radius:0 12px 12px 0;
  padding:13px 15px;font-size:16px;font-style:italic;color:var(--ink2);margin-bottom:16px}
.aviso{background:#FDEEDD;color:var(--amber);border-radius:10px;padding:11px 13px;font-size:14.5px;font-weight:600;margin-bottom:14px}
.falta{color:var(--amber);font-weight:650}
.escolha{background:#FDF3E6;border-top:1px solid #F0DCC0;padding:12px 14px}
.escolha .sec-t{color:var(--amber);margin-bottom:8px}
.escolha .chip{border-color:#E8CBA4}
.card.pisca{animation:pisca 1s ease-out 2}
@keyframes pisca{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 4px rgba(178,91,0,.35)}}
.ensinar{width:100%;margin-top:10px;border:1.5px dashed var(--green);color:var(--green);
  background:#F1F7F2;border-radius:10px;padding:11px;font-size:14.5px;font-weight:650;text-align:center}
.pend{margin-top:22px;font-size:15px;color:var(--ink2);padding:9px 16px;border-radius:999px;background:#ECEAE4;font-weight:600}
.photobtn{margin-top:26px;display:inline-flex;align-items:center;gap:8px;font-size:15.5px;font-weight:650;color:var(--ink2);padding:11px 20px;border:1.5px solid var(--line);border-radius:999px;background:var(--card)}

/* ---------- listas ---------- */
.row{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:flex-start;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:0 0 10px}
.row .bd{flex:1;min-width:0}
.row .t1{font-weight:600;font-size:16px}
.row .t2{font-size:14px;color:var(--ink2);margin-top:2px}
.row .rt{font-size:13px;color:var(--ink2);white-space:nowrap;padding-top:2px}
.d-irrigacao{background:var(--blue)} .d-insumo{background:var(--amber)}
.d-plantio{background:var(--green)} .d-colheita{background:var(--green-d)}
.d-poda{background:#7A6A3F}
.d-observacao{background:var(--purple)}
.thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:0 0 44px;background:#ECEAE4}

.daygrp{margin-bottom:14px}
.dayhd{font-size:13px;font-weight:700;color:var(--ink2);margin:0 4px 6px;text-transform:capitalize}

.acard{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.acard:last-child{border-bottom:0}
.acard .bd{flex:1;min-width:0}
.acard .nm{font-weight:650;font-size:17px}
.acard .mt{font-size:14px;color:var(--ink2);margin-top:2px}
.pill{font-size:12.5px;font-weight:650;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:#E4F0E6;color:var(--green-d)}
.pill.warn{background:#FDEEDD;color:var(--amber)}
.pill.bad{background:#FBE6E4;color:var(--red)}
.pill.neutral{background:#ECEAE4;color:var(--ink2)}

/* ---------- gravacoes ---------- */
.grav{padding:14px 16px;border-bottom:1px solid var(--line)}
.grav:last-child{border-bottom:0}
.grav-top{display:flex;align-items:center;gap:12px}
.play{width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:0 0 46px;font-size:17px}
.play.on{background:var(--ink)}
.grav .bd{flex:1;min-width:0}
.grav .t1{font-weight:650;font-size:16px}
.grav .t2{font-size:14px;color:var(--ink2);margin-top:2px}
.grav-acts{display:flex;gap:8px;margin-top:12px}
.mini{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px;font-size:14.5px;font-weight:650;color:var(--ink2);text-align:center}
.mini.d{color:var(--red);border-color:#E3B7B4}

nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom)
}
nav button{padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink2);font-size:11.5px;font-weight:600;position:relative}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--green)}
.badge{position:absolute;top:4px;right:calc(50% - 24px);background:var(--red);color:#fff;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

.scrim{position:fixed;inset:0;background:rgba(20,25,18,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);
  border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .22s cubic-bezier(.3,.8,.4,1)
}
.sheet.on{transform:translateY(0)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);border-radius:20px 20px 0 0}
.sheet-h h2{flex:1;font-size:18px}
.sheet-b{overflow-y:auto;padding:16px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card);display:flex;gap:10px}

.f{margin-bottom:18px}
.f > label{display:block;font-size:14px;font-weight:650;color:var(--ink2);margin-bottom:7px}
.f .hint{font-size:13px;color:var(--ink2);font-weight:400;margin-top:6px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;min-height:52px
}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--green)}
textarea{min-height:104px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:11px 16px;font-size:15px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border-radius:12px;padding:15px;font-weight:700;font-size:17px;text-align:center;flex:1}
.btn.pri{background:var(--green);color:#fff}
.btn.sec{background:var(--card);border:1.5px solid var(--line);color:var(--ink2);flex:0 0 40%}
.btn.dng{background:var(--card);border:1.5px solid #E3B7B4;color:var(--red)}
.btn:active{opacity:.8}
.linkbtn{color:var(--green);font-weight:650;font-size:15px;padding:6px 0}
.err{background:#FBE6E4;color:var(--red);border-radius:10px;padding:11px 13px;font-size:14.5px;font-weight:600;margin-bottom:14px}
.photoprev{width:100%;border-radius:12px;margin-top:10px;display:block}

#toast{position:fixed;left:16px;right:16px;bottom:96px;z-index:70;background:var(--ink);color:#fff;border-radius:12px;padding:14px 16px;font-size:15.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:translateY(0)}

.menu-item{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:16.5px;font-weight:600}
.menu-item:last-child{border-bottom:0}
.menu-item .ic{font-size:20px;width:26px;text-align:center}
.menu-item .ch{color:var(--ink2);font-weight:400;font-size:15px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink2)}
.kv span:last-child{font-weight:650;text-align:right}
</style>
</head>
<body>

<header>
  <button class="iconbtn hide" id="backBtn" aria-label="Voltar">&#8592;</button>
  <h1 id="hdTitle">Caderno de Campo<span class="sub" id="hdSub"></span></h1>
</header>

<main id="view"></main>

<nav>
  <button data-tab="home" class="on"><span class="ic">&#127793;</span>Início</button>
  <button data-tab="agenda"><span class="ic">&#128197;</span>Agenda</button>
  <button data-tab="diario"><span class="ic">&#128220;</span>Diário</button>
  <button data-tab="mais"><span class="ic">&#9776;</span>Mais</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="sheet-h"><h2 id="shTitle"></h2><button class="iconbtn" id="shClose" style="background:#ECEAE4;color:var(--ink2)">&#10005;</button></div>
  <div class="sheet-b" id="shBody"></div>
  <div class="sheet-f" id="shFoot"></div>
</div>

<div id="toast"></div>

<script>
"use strict";

/* ============ util ============ */
const $ = s => document.querySelector(s);
const el = (t,c,h) => { const n=document.createElement(t); if(c)n.className=c; if(h!==undefined)n.innerHTML=h; return n; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const MS_DAY = 86400000;
function todayISO(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function dayStart(iso){ const [y,m,d]=iso.slice(0,10).split("-").map(Number); return new Date(y,m-1,d).getTime(); }
function daysAgo(iso){ return Math.floor((dayStart(todayISO()) - dayStart(iso)) / MS_DAY); }
function fmtDay(iso){
  const n = daysAgo(iso);
  if(n===0) return "Hoje";
  if(n===1) return "Ontem";
  const [y,m,d]=iso.slice(0,10).split("-");
  const dt=new Date(+y,+m-1,+d);
  const wd=["domingo","segunda","terça","quarta","quinta","sexta","sábado"][dt.getDay()];
  return (n<7? wd+", " : "") + d+"/"+m + (String(new Date().getFullYear())!==y ? "/"+y : "");
}
function fmtAgo(iso){ const n=daysAgo(iso); return n===0?"hoje":n===1?"ontem":"há "+n+" dias"; }
function fmtDur(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("on"),3000); }
function num(v){ const n=parseFloat(String(v).replace(",",".")); return isFinite(n)?n:null; }
function fmtNum(n){ return String(n).replace(".",","); }

/* ============ banco ============ */
const DB_NAME="caderno-campo", DB_VER=4;
const STORES=["areas","insumos","plantios","registros","regras","gravacoes","pendentes","config"];
let _db=null;
function open(){
  return new Promise((ok,err)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{ const d=e.target.result; STORES.forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:"id"}); }); };
    r.onsuccess=e=>{ _db=e.target.result; ok(_db); };
    r.onerror=e=>err(e.target.error);
  });
}
function tx(store,mode){ return _db.transaction(store,mode).objectStore(store); }
function putBruto(store,obj){ return new Promise((ok,err)=>{ const r=tx(store,"readwrite").put(obj); r.onsuccess=()=>ok(obj); r.onerror=e=>err(e.target.error); }); }
function delBruto(store,id){ return new Promise((ok,err)=>{ const r=tx(store,"readwrite").delete(id); r.onsuccess=()=>ok(); r.onerror=e=>err(e.target.error); }); }

/* o que viaja pra nuvem */
const TIPO_DA_LOJA = {areas:"area", insumos:"insumo", plantios:"plantio", registros:"registro", regras:"regra"};
const LOJA_DO_TIPO = {area:"areas", insumo:"insumos", plantio:"plantios", registro:"registros", regra:"regras"};

async function marcarPendente(loja, id, apagado, quando){
  const tipo = TIPO_DA_LOJA[loja]; if(!tipo) return;
  const p = {id: loja + ":" + id, loja, oid: id, tipo, apagado: !!apagado, atualizadoEm: quando};
  await putBruto("pendentes", p);
  const ix = S.pendentes.findIndex(x => x.id === p.id);   /* a lista viva também precisa saber */
  if(ix >= 0) S.pendentes[ix] = p; else S.pendentes.push(p);
  agendarSync();
}

async function put(store,obj){
  if(TIPO_DA_LOJA[store]){
    obj.atualizadoEm = new Date().toISOString();
    await putBruto(store,obj);
    await marcarPendente(store, obj.id, false, obj.atualizadoEm);
    return obj;
  }
  return putBruto(store,obj);
}
async function del(store,id){
  await delBruto(store,id);
  if(TIPO_DA_LOJA[store]) await marcarPendente(store, id, true, new Date().toISOString());
}
function all(store){ return new Promise((ok,err)=>{ const r=tx(store,"readonly").getAll(); r.onsuccess=()=>ok(r.result||[]); r.onerror=e=>err(e.target.error); }); }
function clearStore(store){ return new Promise((ok,err)=>{ const r=tx(store,"readwrite").clear(); r.onsuccess=()=>ok(); r.onerror=e=>err(e.target.error); }); }

/* ============ estado ============ */
const S = { areas:[], insumos:[], plantios:[], registros:[], regras:[], gravacoes:[], pendentes:[], config:{} };
async function load(){
  const [a,i,p,r,rg,g,pe,c] = await Promise.all(STORES.map(all));
  S.areas=a; S.insumos=i; S.plantios=p; S.registros=r; S.regras=rg; S.gravacoes=g; S.pendentes=pe;
  S.config = (c.find(x=>x.id==="app")||{id:"app"});
}
const areaById = id => S.areas.find(a=>a.id===id);
const insumoById = id => S.insumos.find(x=>x.id===id);
const sortedRegs = () => S.registros.slice().sort((a,b)=> (b.data+(b.hora||"")).localeCompare(a.data+(a.hora||"")) );
const pendentes = () => S.gravacoes.filter(g=>g.status!=="processada").sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora));

function ultimaIrrigacao(areaId){
  const rs=S.registros.filter(r=>r.tipo==="irrigacao"&&r.areaId===areaId).sort((a,b)=>b.data.localeCompare(a.data));
  return rs.length? rs[0].data : null;
}
function plantiosAtivos(areaId){ return S.plantios.filter(p=>p.areaId===areaId && p.status!=="encerrado"); }

/* ============ status geral (a plantinha) ============ */
function statusGeral(){
  if(!S.registros.length && !S.gravacoes.length)
    return {nivel:"ok", t:"Comece falando", s:"Toque no microfone e diga o que você fez. Depois eu organizo."};

  const lista = (typeof tarefas === "function") ? tarefas() : [];
  if(!lista.length)
    return {nivel:"ok", t:"Tudo tranquilo", s:"Sem combinados ainda. Diga “a cada quantos dias” e eu passo a te cobrar."};

  const atrasadas = lista.filter(t => t.atraso > 0).sort((a,b) => b.atraso - a.atraso);
  const hoje = lista.filter(t => t.atraso === 0);

  if(atrasadas.length){
    const t = atrasadas.length === 1
      ? nomeDaRegra(atrasadas[0].reg) + " atrasado"
      : atrasadas.length + " coisas atrasadas";
    const s = atrasadas.length === 1
      ? (atrasadas[0].atraso === 1 ? "1 dia além do combinado." : atrasadas[0].atraso + " dias além do combinado.")
      : atrasadas.slice(0,3).map(x => nomeDaRegra(x.reg) + " (" + x.atraso + "d)").join(" · ");
    return {nivel:"atraso", t, s};
  }
  if(hoje.length)
    return {nivel:"atencao", t:"Vence hoje",
            s: hoje.map(x => nomeDaRegra(x.reg)).join(" · ")};

  const prox = lista[0];
  return {nivel:"ok", t:"Tudo em dia",
          s: prox ? "Próximo: " + nomeDaRegra(prox.reg) + " em " + (-prox.atraso) + " dia(s)." : "Nada atrasado."};
}

function plantaSVG(nivel){
  const C = nivel==="atraso" ? {f1:"#C4452F",f2:"#A63A28",st:"#8C6239",d:20,o:.92}
          : nivel==="atencao"? {f1:"#D89A16",f2:"#B87F0E",st:"#6D8C3F",d:9, o:1}
          :                    {f1:"#48A55C",f2:"#2E7D42",st:"#3F7A2E",d:0, o:1};
  return `<svg class="plant" viewBox="0 0 100 100" aria-hidden="true">
    <ellipse cx="50" cy="95" rx="26" ry="4" fill="#000" opacity=".07"/>
    <path d="M31 70 L35 90 Q35.5 93 39 93 L61 93 Q64.5 93 65 90 L69 70 Z" fill="#B98055"/>
    <rect x="28" y="63" width="44" height="9" rx="4" fill="#CE9367"/>
    <path d="M50 66 C50 55 50 46 50 33" stroke="${C.st}" stroke-width="3.6" fill="none" stroke-linecap="round" opacity="${C.o}"/>
    <g transform="rotate(${C.d} 50 48)">
      <path d="M49 50 C37 51 28 45 25 36 C36 33 46 40 49 50 Z" fill="${C.f1}" opacity="${C.o}"/>
    </g>
    <g transform="rotate(${-C.d} 50 43)">
      <path d="M51 44 C63 45 72 39 75 30 C64 27 54 34 51 44 Z" fill="${C.f2}" opacity="${C.o}"/>
    </g>
    <g transform="rotate(${C.d*0.6} 50 30)">

function comprimir(file){
  return new Promise(res=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const MAX=1600;
      let {width:w,height:h}=img;
      if(Math.max(w,h)>MAX){ const k=MAX/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      c.toBlob(b=>{ URL.revokeObjectURL(url); res(b||file); },"image/jpeg",.82);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}

/* ============ fala ao vivo ============ */
/* No Android o reconhecimento de voz precisa do microfone com exclusividade.
   Por isso: se o navegador entende voz, ele fica com o microfone sozinho.
   Só quando não entende é que gravamos o áudio pra não perder o que foi dito. */
let sess = null;
function micSuportado(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
function falaSuportada(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
const ehMobile = () => /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || "");

function toggleFala(){
  if(sess){ encerrarFala(); return; }
  if(falaSuportada()) iniciarEscuta(); else iniciarGravacao();
}

function iniciarEscuta(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const sr = new SR();
  sr.lang = "pt-BR";
  sr.continuous = !ehMobile();   /* no Android, contínuo trava: reiniciamos a cada pausa */
  sr.interimResults = true;
  sr.maxAlternatives = 1;

  sess = {modo:"escuta", sr, inicio:Date.now(), texto:"", parcial:"", erro:null, encerrando:false, timer:null};

  sr.onresult = ev => {
    if(!sess) return;
    let fin = "", par = "";
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      const r = ev.results[i];
      if(r.isFinal) fin += r[0].transcript + " "; else par += r[0].transcript;
    }
    if(fin){ sess.texto += fin; sess.parcial = ""; } else { sess.parcial = par; }
    sess.erro = null;
    pintarFala();
  };
  sr.onerror = ev => {
    if(!sess) return;
    sess.erro = ev.error;
    if(ev.error === "not-allowed" || ev.error === "service-not-allowed" || ev.error === "audio-capture"){
      sess.encerrando = true;
      try { sr.stop(); } catch(e){}
    }
    pintarFala();
  };
  sr.onend = () => {
    if(!sess) return;
    if(!sess.encerrando){                       /* pausa natural: volta a ouvir */
      try { sr.start(); return; } catch(e){}
    }
    finalizarEscuta();
  };

  try { sr.start(); }
  catch(e){ sess = null; toast("Não consegui iniciar o microfone."); return; }

  render();
  sess.timer = setInterval(() => {
    const t = document.getElementById("micTime");
    if(t && sess) t.textContent = fmtDur(Math.round((Date.now() - sess.inicio)/1000));
  }, 250);
}

function finalizarEscuta(){
  const s = sess; if(!s) return;
  sess = null;
  clearInterval(s.timer);
  const texto = ((s.texto || "") + " " + (s.parcial || "")).replace(/\s+/g," ").trim();
  render();
  if(!texto){
    toast(s.erro === "not-allowed" || s.erro === "service-not-allowed"
            ? "O navegador não liberou o microfone. Autorize nas permissões do site."
        : s.erro === "audio-capture" ? "Não consegui acessar o microfone. Feche outros apps que estejam usando ele."
        : s.erro === "network" ? "Sem internet pra entender a fala agora."
        : "Não ouvi nada. Toque de novo e fale mais perto do aparelho.");
    return;
  }
  telaConfirmar(texto, interpretar(texto), null);
}

/* modo sem reconhecimento: guarda o áudio pra não perder o que foi dito */
async function iniciarGravacao(){
  if(!micSuportado()){ toast("Este navegador não permite gravar áudio aqui."); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ console.error(e); toast("Não consegui usar o microfone. Verifique a permissão do navegador."); return; }

  const mime = ["audio/webm;codecs=opus","audio/webm","audio/mp4"]
    .find(m => window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
  const mr = new MediaRecorder(stream, mime ? {mimeType:mime, audioBitsPerSecond:24000} : {});

  sess = {modo:"gravacao", mr, stream, chunks:[], inicio:Date.now(), mime, texto:"", parcial:"", erro:null, encerrando:false, timer:null};
  mr.ondataavailable = e => { if(e.data && e.data.size) sess.chunks.push(e.data); };
  mr.onstop = () => finalizarGravacao();
  mr.start();

  render();
  sess.timer = setInterval(() => {
    const t = document.getElementById("micTime");
    if(t && sess) t.textContent = fmtDur(Math.round((Date.now() - sess.inicio)/1000));
  }, 250);
}

async function finalizarGravacao(){
  const s = sess; if(!s) return;
  sess = null;
  clearInterval(s.timer);
  try { s.stream.getTracks().forEach(t => t.stop()); } catch(e){}
  const dur = Math.max(1, Math.round((Date.now() - s.inicio)/1000));
  const blob = new Blob(s.chunks, {type: s.mime || "audio/webm"});
  if(blob.size < 400){ render(); toast("Gravação muito curta, descartada."); return; }
  const g = {id:uid(), blob, dur, tipoMime:blob.type, data:todayISO(), hora:nowHM(),
             status:"pendente", texto:null, areaId:null, criadoEm:new Date().toISOString()};
  await put("gravacoes", g); S.gravacoes.push(g);
  render();
  toast("Este navegador não entende voz. O áudio ficou guardado em Gravações.");
}

function encerrarFala(){
  if(!sess || sess.encerrando) return;
  sess.encerrando = true;
  clearInterval(sess.timer); sess.timer = null;
  if(sess.modo === "escuta"){ try { sess.sr.stop(); } catch(e){ finalizarEscuta(); } }
  else { try { sess.mr.stop(); } catch(e){ finalizarGravacao(); } }
}

function pintarFala(){
  const box = document.getElementById("falaViva");
  if(!box || !sess) return;
  const t = (sess.texto || "").trim(), p = (sess.parcial || "").trim();
  if(sess.erro && !t && !p){
    const msg = sess.erro === "network" ? "Sem internet pra entender agora…"
              : sess.erro === "no-speech" ? "Não ouvi nada ainda. Fale mais perto…"
              : sess.erro === "audio-capture" ? "O microfone está ocupado por outro app."
              : sess.erro === "not-allowed" || sess.erro === "service-not-allowed" ? "Permissão de microfone negada."
              : "Tentando ouvir…";
    box.innerHTML = '<span class="par">' + esc(msg) + '</span>';
    return;
  }
  box.innerHTML = (t || p)
    ? esc(t) + (p ? ' <span class="par">' + esc(p) + '</span>' : "")
    : '<span class="par">Pode falar…</span>';
}

let audioAtual = null, audioId = null;
function tocar(g, botao){
  if(audioAtual){
    audioAtual.pause(); audioAtual = null;
    document.querySelectorAll(".play.on").forEach(b => { b.classList.remove("on"); b.innerHTML = "&#9654;"; });
    if(audioId === g.id){ audioId = null; return; }
  }
  const a = new Audio(URL.createObjectURL(g.blob));
  audioAtual = a; audioId = g.id;
  botao.classList.add("on"); botao.innerHTML = "&#9724;";
  a.onended = () => { botao.classList.remove("on"); botao.innerHTML = "&#9654;"; audioAtual = null; audioId = null; };
  a.play().catch(() => { toast("Não consegui tocar o áudio."); botao.classList.remove("on"); botao.innerHTML = "&#9654;"; });
}

const VOCAB_VERSAO = 4;

const VOCAB_INSUMOS = [

];

/* Junta áreas e insumos que são a mesma coisa escrita de outro jeito
   ("Linha Dos Tomates" e "Linha do tomate"). Os registros da duplicata passam
   pro sobrevivente, e a frequência que o Rob já tinha definido é preservada. */
async function juntarDuplicatas(){
  let juntadas = 0;

  /* Cada área existente escolhe o SEU melhor par no vocabulário.
     Sem isso, "Linha Piscina 2A" e "2B" (94% parecidas) virariam uma só. */
  const agrupar = (itens, vocab) => {
    const grupos = new Map();
    itens.forEach(it => {
      const n = normalizarFala(it.nome);
      let melhor = null;
      vocab.forEach(v => {
        const s = parecido(n, normalizarFala(v.nome));
        if(!melhor || s > melhor.s) melhor = {s, v};
      });
      if(melhor && melhor.s >= 0.8){
        if(!grupos.has(melhor.v.nome)) grupos.set(melhor.v.nome, {v: melhor.v, itens: []});
        grupos.get(melhor.v.nome).itens.push(it);
      }
    });
    return grupos;
  };

  for(const {v, itens} of agrupar(S.areas, VOCAB_AREAS).values()){
    const alvo = normalizarFala(v.nome);
    const fica = itens.find(a => normalizarFala(a.nome) === alvo) || itens[0];
    fica.nome = v.nome;
    if(!fica.tipo) fica.tipo = v.tipo;

    for(const o of itens.filter(a => a.id !== fica.id)){
      fica.apelidos = [...new Set((fica.apelidos||[]).concat(o.apelidos||[]))];
      if(!fica.frequencia && o.frequencia) fica.frequencia = o.frequencia;
      if(!fica.cultura && o.cultura) fica.cultura = o.cultura;
      if(!fica.obs && o.obs) fica.obs = o.obs;
      for(const r of S.registros)  if(r.areaId === o.id){ r.areaId = fica.id; await put("registros", r); }
      for(const pl of S.plantios)  if(pl.areaId === o.id){ pl.areaId = fica.id; await put("plantios", pl); }
      for(const g of S.gravacoes)  if(g.areaId === o.id){ g.areaId = fica.id; await put("gravacoes", g); }
      await del("areas", o.id);
      S.areas = S.areas.filter(a => a.id !== o.id);
      juntadas++;
    }
    fica.apelidos = [...new Set((fica.apelidos||[]).concat(v.apelidos))];
    await put("areas", fica);
  }

  for(const {v, itens} of agrupar(S.insumos, VOCAB_INSUMOS).values()){
    const fica = itens.find(i => i.nome === v.nome) || itens[0];
    fica.nome = v.nome;
    if(!fica.tipo) fica.tipo = v.tipo;
    fica.unidade = v.unidade;

    for(const o of itens.filter(i => i.id !== fica.id)){
      fica.apelidos = [...new Set((fica.apelidos||[]).concat(o.apelidos||[]))];
      if(!fica.carencia && o.carencia) fica.carencia = o.carencia;
      for(const r of S.registros) if(r.insumoId === o.id){ r.insumoId = fica.id; await put("registros", r); }
      await del("insumos", o.id);
      S.insumos = S.insumos.filter(i => i.id !== o.id);
      juntadas++;
    }
    fica.apelidos = [...new Set((fica.apelidos||[]).concat(v.apelidos))];
    await put("insumos", fica);
  }
  return juntadas;
}

/* Instala o vocabulário sem duplicar nada. Se já existe algo com o mesmo nome,
   só completa o que estiver faltando (apelidos, unidade) — não sobrescreve. */

/* ---- identificador que nasce do nome ----
   Se o identificador for sorteado, cada aparelho cria o seu e a sincronia acaba com
   áreas rivais: o registro de um aponta pra uma área que o outro não conhece.
   Nascendo do nome, "Linha esquerda" é a mesma coisa em qualquer aparelho, sempre. */
const idCanonico = (prefixo, nome) => prefixo + "-" + normalizarFala(nome).replace(/\s+/g, "-");

async function repontar(deId, paraId, campo){
  for(const r of S.registros) if(r[campo] === deId){ r[campo] = paraId; await put("registros", r); }
  if(campo === "areaId"){
    for(const p of S.plantios)  if(p.areaId === deId){ p.areaId = paraId; await put("plantios", p); }
    for(const g of S.gravacoes) if(g.areaId === deId){ g.areaId = paraId; await putBruto("gravacoes", g); }
  }
}

async function canonizarIds(){
  let trocados = 0;

  const arrumar = async (loja, vocab, prefixo, campo) => {
    for(const v of vocab){
      const alvo = idCanonico(prefixo, v.nome);
      const iguais = S[loja].filter(o => normalizarFala(o.nome) === normalizarFala(v.nome));
      if(!iguais.length) continue;

      let fica = iguais.find(o => o.id === alvo);
      let resto = iguais.filter(o => o.id !== alvo);

      if(!fica){
        /* promove o primeiro pro identificador certo, preservando tudo que ele tem */
        const base = resto.shift();
        fica = Object.assign({}, base, {id: alvo});
        await put(loja, fica);
        S[loja].push(fica);
        await repontar(base.id, alvo, campo);
        await del(loja, base.id);
        S[loja] = S[loja].filter(o => o.id !== base.id);
        trocados++;
      }

      for(const o of resto){
        fica.apelidos = [...new Set((fica.apelidos || []).concat(o.apelidos || []))];
        if(!fica.frequencia && o.frequencia) fica.frequencia = o.frequencia;
        if(!fica.cultura && o.cultura) fica.cultura = o.cultura;
        if(!fica.carencia && o.carencia) fica.carencia = o.carencia;
        await repontar(o.id, alvo, campo);
        await del(loja, o.id);
        S[loja] = S[loja].filter(x => x.id !== o.id);
        trocados++;
      }
      await put(loja, fica);
    }
  };

  await arrumar("areas",   VOCAB_AREAS,   "area",   "areaId");
  await arrumar("insumos", VOCAB_INSUMOS, "insumo", "insumoId");
  return trocados;
}

/* ---- registros soltos ----
   Registro que aponta pra uma área que não existe mais aparece no diário e some das
   áreas. Como toda gravação guarda a frase original, dá pra reencontrar o lugar sozinho. */
async function repararOrfaos(){
  const temArea   = new Set(S.areas.map(a => a.id));
  const temInsumo = new Set(S.insumos.map(i => i.id));
  let reparados = 0;

  for(const r of S.registros){
    let mudou = false;

    if(r.areaId && !temArea.has(r.areaId)){ r.areaId = null; mudou = true; }
    if(!r.areaId && r.fala){
      const m = acharNoTexto(normalizarFala(r.fala), S.areas, termosDaArea, 0.72);
      if(m){ r.areaId = m.item.id; mudou = true; }
    }

    if(r.insumoId && !temInsumo.has(r.insumoId)){ r.insumoId = null; mudou = true; }
    if(r.tipo === "insumo" && !r.insumoId && r.fala){
      const m = acharNoTexto(normalizarFala(r.fala), S.insumos, termosDoInsumo, 0.72);
      if(m){ r.insumoId = m.item.id; mudou = true; }
    }

    if(mudou){ await put("registros", r); reparados++; }
  }
  return reparados;
}

async function instalarVocabulario(){
  let novas = 0, novosIns = 0, completadas = 0;

  for(const v of VOCAB_AREAS){
    const ja = S.areas.find(a => semAcento(a.nome) === semAcento(v.nome));
    if(ja){
      const antes = (ja.apelidos||[]).length;
      ja.apelidos = [...new Set((ja.apelidos||[]).concat(v.apelidos))];
      if(!ja.tipo) ja.tipo = v.tipo;
      if(ja.apelidos.length !== antes){ await put("areas", ja); completadas++; }
      continue;
    }
    /* id fixo: assim dois aparelhos criam a MESMA área e a sincronia não duplica */
    const o = {id:idCanonico("area", v.nome), nome:v.nome, tipo:v.tipo,
               frequencia:null, cultura:"", apelidos:v.apelidos, obs:"", criadoEm:new Date().toISOString()};
    await put("areas", o); S.areas.push(o); novas++;
  }

  for(const v of VOCAB_INSUMOS){
    const ja = S.insumos.find(i => semAcento(i.nome) === semAcento(v.nome));
    if(ja){
      const antes = (ja.apelidos||[]).length;
      ja.apelidos = [...new Set((ja.apelidos||[]).concat(v.apelidos))];
      if(!ja.unidade) ja.unidade = v.unidade;
      if(!ja.tipo) ja.tipo = v.tipo;
      if(ja.apelidos.length !== antes || !ja.unidade){ await put("insumos", ja); completadas++; }
      continue;
    }
    const o = {id:idCanonico("insumo", v.nome), nome:v.nome, tipo:v.tipo,
               unidade:v.unidade, apelidos:v.apelidos, carencia:null, obs:"", criadoEm:new Date().toISOString()};
    await put("insumos", o); S.insumos.push(o); novosIns++;
  }
  return {novas, novosIns, completadas};
}

/* ============ interpretador (vocabulário fechado) ============ */
/* O Chrome ouve como quer — "linha dois" pode virar "linda dois". Não dá pra mandar
   nele. O que dá é comparar o que ele ouviu com a lista fixa do Rob e escolher o mais
   parecido. Lista pequena e conhecida = acerto alto. O que não bater, ele pergunta. */

const semAcento = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();

const NUM_PT = {zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,
  dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,
  dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,
  cem:100,cento:100,duzentos:200,trezentos:300,quatrocentos:400,quinhentos:500,meio:0.5,meia:0.5};

const UNIDADE_TOK = /^(hora|horas|minuto|minutos|litro|litros|quilo|quilos|kg|grama|gramas|dia|dias)$/;

function numerosParaDigitos(txt){
  const toks = txt.split(" ");
  const limpo = t => t.replace(/[.,;:!?]/g,"");
  const ehNumero = (tok, prox) => {
    if(NUM_PT[tok] === undefined) return false;
    if((tok === "meio" || tok === "meia") && !UNIDADE_TOK.test(limpo(prox||""))) return false;
    return true;
  };
  const out = []; let i = 0;
  while(i < toks.length){
    if(!ehNumero(limpo(toks[i]), toks[i+1])){ out.push(toks[i]); i++; continue; }
    let val = NUM_PT[limpo(toks[i])]; i++;
    while(i+1 < toks.length && limpo(toks[i]) === "e" && NUM_PT[limpo(toks[i+1])] !== undefined){
      val += NUM_PT[limpo(toks[i+1])]; i += 2;
    }
    out.push(String(val));
  }
  return out.join(" ");
}

function normalizarFala(t){
  let x = semAcento(t);
  x = numerosParaDigitos(x);
  x = x.replace(/(\d)[.,](\d)/g, "$1\u0001$2");      /* protege decimais: 0,5 e 0.5 */
  x = x.replace(/[^a-z0-9\s\u0001]/g, " ");
  x = x.replace(/\u0001/g, ".");
  return x.replace(/\s+/g," ").trim();
}

/* distância de edição: quantas letras precisam mudar de uma palavra pra outra */
function distancia(a, b){
  const m = a.length, n = b.length;
  if(!m) return n; if(!n) return m;
  let ant = new Array(n+1), atual = new Array(n+1);
  for(let j = 0; j <= n; j++) ant[j] = j;
  for(let i = 1; i <= m; i++){
    atual[0] = i;
    for(let j = 1; j <= n; j++)
      atual[j] = Math.min(ant[j] + 1, atual[j-1] + 1, ant[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    const t = ant; ant = atual; atual = t;
  }
  return ant[n];
}
const parecido = (a, b) => { const m = Math.max(a.length, b.length); return m ? 1 - distancia(a,b)/m : 0; };

/* todas as formas de chamar uma área */
function termosDaArea(a){
  const lista = [a.nome];
  (a.apelidos || []).forEach(x => lista.push(x));
  if(a.cultura) lista.push(a.cultura);
  const toks = semAcento(a.nome).split(" ");
  if(toks.length > 1){
    const resto = toks.slice(1);
    while(resto.length && /^(do|da|de|dos|das|o|a|os|as)$/.test(resto[0])) resto.shift();
    if(resto.length) lista.push(resto.join(" "));
  }
  const formas = [];
  lista.map(normalizarFala).forEach(t => {
    formas.push(t);
    const solto = t.replace(/(\d)([ab])\b/g, "$1 $2");   /* "piscina 2a" também vale como "piscina 2 a" */
    if(solto !== t) formas.push(solto);
  });
  return [...new Set(formas)].filter(x => x.length >= 3);
}
const termosDoInsumo = i => [...new Set([i.nome].concat(i.apelidos||[]).map(normalizarFala))].filter(x => x.length >= 3);

/* procura o item da lista mais parecido com algum trecho da fala */
function acharNoTexto(txt, itens, termosDe, minSim){
  const toks = txt.split(" ");
  let melhor = null;
  itens.forEach(it => {
    termosDe(it).forEach(termo => {
      const nt = termo.split(" ").length;
      for(let i = 0; i < toks.length; i++){
        for(let n = Math.max(1, nt-1); n <= nt+1 && i+n <= toks.length; n++){
          const janela = toks.slice(i, i+n).join(" ");
          const s = parecido(janela, termo);
          if(s >= minSim && (!melhor || s > melhor.s + 0.001 ||
             (Math.abs(s - melhor.s) <= 0.001 && termo.length > melhor.termo.length)))
            melhor = {s, item: it, termo, i, n};
        }
      }
    });
  });
  return melhor;
}

/* "ouvidos" são as coisas que o Chrome entrega no lugar do verbo certo.
   "reguei" vira "cheguei" e "peguei" o tempo todo. */
const PALAVRA_BOBA = /^(a|o|as|os|na|no|nas|nos|de|da|do|dos|das|em|por|com|e|um|uma|que|pra|para|linha|estufa|piscina|hoje|ontem)$/;

function melhorJanela(txt, termos){
  const toks = txt.split(" ");
  let melhor = null;
  termos.forEach(termo => {
    const nt = termo.split(" ").length;
    for(let i = 0; i < toks.length; i++){
      for(let n = Math.max(1, nt-1); n <= nt+1 && i+n <= toks.length; n++){
        const j = toks.slice(i, i+n).join(" ");
        if(j.length < 3 || PALAVRA_BOBA.test(j)) continue;
        const s = parecido(j, termo);
        if(!melhor || s > melhor.s) melhor = {s, janela:j};
      }
    }
  });
  return melhor;
}

/* "estufa 1 e 2", "estufa 1, 2 e 3" — devolve todas as áreas citadas.
   O casamento normal acha uma só; aqui procuramos as irmãs que ficaram de fora. */
function areasDaFrase(frag, areas){
  const achadas = [];
  const juntar = a => { if(a && !achadas.some(x => x.id === a.id)) achadas.push(a); };

  const principal = acharNoTexto(frag, areas, termosDaArea, 0.72);
  if(!principal) return achadas;
  juntar(principal.item);

  const base = principal.termo.replace(/\s*\d+[ab]?\s*$/, "").trim();   /* "estufa 1" -> "estufa" */
  if(base.length < 3) return achadas;

  const pos = frag.indexOf(principal.termo);
  const depois = pos >= 0 ? frag.slice(pos + principal.termo.length) : "";
  const corte = depois.search(/\b(a cada|de \d+ em|tod[oa]s?|por|durante|com|e cada)\b/);
  const trecho = corte >= 0 ? depois.slice(0, corte) : depois;
  (trecho.match(/\b(\d+[ab]?)\b/g) || []).forEach(n => {
    const m = acharNoTexto(base + " " + n, areas, termosDaArea, 0.8);
    if(m) juntar(m.item);
  });

  if(/\btodas?\b/.test(frag))
    areas.filter(a => normalizarFala(a.nome).startsWith(base)).forEach(juntar);

  return achadas;
}

const ACOES = [
  {p:"reguei", tipo:"irrigacao", ouvidos:["cheguei","peguei","seguei","leguei","reguei a","regue","rega","regar","reguem","reguei o"]},
  {p:"regei",  tipo:"irrigacao", ouvidos:[]},
  {p:"regamos",tipo:"irrigacao", ouvidos:[]},
  {p:"irriguei",tipo:"irrigacao",ouvidos:["irrigue","irrigou","irrigar","irriguei a"]},
  {p:"irrigamos",tipo:"irrigacao",ouvidos:[]},
  {p:"molhei", tipo:"irrigacao", ouvidos:["molho","molhou","molhar"]},
  {p:"pulverizei",tipo:"insumo", forma:"Foliar", ouvidos:["pulverize","pulverizou","pulverizar"]},
  {p:"pulverizamos",tipo:"insumo", forma:"Foliar", ouvidos:[]},
  {p:"adicionei",tipo:"insumo", ouvidos:["adicione","adicionou","adicionar","adicionei o","adicionar o"]},
  {p:"adubei", tipo:"insumo", ouvidos:["adubou","adubar","aduba"]},
  {p:"apliquei",tipo:"insumo", ouvidos:["aplique","aplicou","aplicar"]},
  {p:"botei",  tipo:"insumo", ouvidos:["botou","botar"]},
  {p:"coloquei",tipo:"insumo", ouvidos:["coloque","colocou","colocar"]},
  {p:"passei", tipo:"insumo", ouvidos:["passou","passar"]},
  {p:"podei",  tipo:"poda", ouvidos:["pode","podem","podar","podou","poderei","podei a"]},
  {p:"podamos",tipo:"poda", ouvidos:[]},
  {p:"fiz a poda",tipo:"poda", ouvidos:["fiz poda","fez a poda"]},
  {p:"plantei",tipo:"plantio", ouvidos:["plante","plantou","plantar"]},
  {p:"plantamos",tipo:"plantio", ouvidos:[]},
  {p:"semeei", tipo:"plantio", ouvidos:["semear","semeou"]},
  {p:"comecei o plantio", tipo:"plantio", ouvidos:["comecei plantio","comecou o plantio","comece o plantio"]},
  {p:"colhi",  tipo:"colheita", ouvidos:["colher","colhe","colheu","corri"]},
  {p:"colhemos",tipo:"colheita", ouvidos:[]}
];
const termosDaAcao = a => [a.p].concat(a.ouvidos || []);
const acharAcao = txt => acharNoTexto(txt, ACOES, termosDaAcao, 0.74);

const METODOS_RE = [[/\bmicro ?aspers/,"Microaspersão"],[/\bgotej/,"Gotejo"],[/\baspers|aspersor/,"Aspersão"],
                    [/\bmangueir/,"Mangueira"],[/\bregador|balde|manual/,"Manual"]];
const FORMAS_RE  = [[/\bfertirriga/,"Fertirrigação"],[/\bfoliar|na folha|nas folhas/,"Foliar"],
                    [/\bno solo|na terra|no chao/,"No solo"],[/\bcobertura/,"Cobertura"]];

const MESES = {janeiro:1,fevereiro:2,marco:3,abril:4,maio:5,junho:6,julho:7,
               agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};

function dataISO(y, m, d){
  return y + "-" + String(m).padStart(2,"0") + "-" + String(d).padStart(2,"0");
}
function acharData(txt, hoje){
  if(/\banteontem\b/.test(txt)) return new Date(dayStart(hoje) - 2*MS_DAY).toISOString().slice(0,10);
  if(/\bontem\b/.test(txt))     return new Date(dayStart(hoje) - 1*MS_DAY).toISOString().slice(0,10);

  const [ay, am, ad] = hoje.split("-").map(Number);
  let m = txt.match(/\b(\d{1,2})\s+de\s+([a-z]+)/);
  if(m){
    const nome = Object.keys(MESES).find(x => parecido(m[2], x) >= 0.8);
    if(nome){
      const dia = +m[1], mes = MESES[nome];
      let ano = ay;
      if(mes > am || (mes === am && dia > ad)) ano--;   /* mês à frente = ano passado */
      return dataISO(ano, mes, dia);
    }
  }
  m = txt.match(/\b(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*\/\s*(\d{2,4}))?/);
  if(m){
    let ano = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : ay;
    const mes = +m[2], dia = +m[1];
    if(!m[3] && (mes > am || (mes === am && dia > ad))) ano--;
    return dataISO(ano, mes, dia);
  }
  m = txt.match(/\bdia (\d{1,2})\b/);
  if(m){
    const dia = +m[1];
    let mes = am, ano = ay;
    if(dia > ad){ mes--; if(mes < 1){ mes = 12; ano--; } }
    return dataISO(ano, mes, dia);
  }
  return hoje;
}

/* "a cada 15 dias" -> 15 · "toda semana" -> 7 · "a cada 2 semanas" -> 14 · "todo mes" -> 30 */
function diasDaFrequencia(txt){
  const t = semAcento(txt);
  let m = t.match(/a cada (\d+) (dias?|semanas?|mes)/);
  if(m){ const n = +m[1]; return /semana/.test(m[2]) ? n*7 : /mes/.test(m[2]) ? n*30 : n; }
  m = t.match(/de (\d+) em \d+ dias?/);
  if(m) return +m[1];
  if(/tod[oa]s? (os |as )?dias?/.test(t)) return 1;
  if(/tod[oa]s? (os |as )?semanas?|toda semana/.test(t)) return 7;
  if(/tod[oa]s? (os |as )?mes|todo mes/.test(t)) return 30;
  return null;
}

function temAcao(frag){ return !!acharAcao(frag); }

function fragmentar(txt){
  const partes = txt.split(/\s+(?:e tambem|tambem|e)\s+/);
  const frags = [];
  partes.forEach(p => {
    if(!frags.length || temAcao(p)) frags.push(p);
    else frags[frags.length-1] += " e " + p;
  });
  return frags.filter(f => f.trim());
}

function interpretar(falaOriginal, ctx){
  ctx = ctx || {};
  const areas   = ctx.areas   || S.areas;
  const insumos = ctx.insumos || S.insumos;
  const hoje    = ctx.hoje    || todayISO();

  const base = normalizarFala(falaOriginal);
  const frags = fragmentar(base);
  const drafts = [];
  let areaHerdada = null;

  frags.forEach(frag => {
    const d = {tipo:"observacao", data: acharData(frag, hoje), hora: nowHM(), obs:""};
    if(/\bde manha|pela manha\b/.test(frag)) d.hora = "08:00";
    else if(/\bde tarde|a tarde|pela tarde\b/.test(frag)) d.hora = "15:00";

    const acao = acharAcao(frag);
    const ins  = acharNoTexto(frag, insumos, termosDoInsumo, 0.72);

    if(acao){
      d.tipo = acao.item.tipo;
      if(acao.item.forma) d.forma = acao.item.forma;
      /* "reguei" com um insumo na frase é aplicação, não rega */
      if(d.tipo === "irrigacao" && ins) d.tipo = "insumo";
    } else if(ins){
      d.tipo = "insumo";
    }
    if(!acao && !ins && /\d+\s*(minutos?|min\b|horas?|litros?|l\b)/.test(frag) && /\b(linha|estufa|piscina)\b/.test(frag))
      d.tipo = "irrigacao";   /* "…a linha da direita por 20 minutos" sem verbo entendido */
    if(ins && (d.tipo === "insumo")){ d.insumoId = ins.item.id; if(!d.unidade) d.unidade = ins.item.unidade; }

    const ar = acharNoTexto(frag, areas, termosDaArea, 0.72);
    if(ar){ d.areaId = ar.item.id; areaHerdada = ar.item.id; d.areaConfianca = ar.s; }
    else if(areaHerdada && d.tipo !== "observacao") d.areaId = areaHerdada;
    d.areasCitadas = ar ? areasDaFrase(frag, areas).map(a => a.id) : [];

    const n = x => parseFloat(String(x).replace(",","."));
    const min = frag.match(/(\d+(?:[.,]\d+)?)\s*(?:minutos?|min\b)/);
    const hrs = frag.match(/(\d+(?:[.,]\d+)?)\s*horas?/);
    const lit = frag.match(/(\d+(?:[.,]\d+)?)\s*(?:litros?|l\b)/);
    const kg  = frag.match(/(\d+(?:[.,]\d+)?)\s*(?:quilos?|kg\b)/);
    const gr  = frag.match(/(\d+(?:[.,]\d+)?)\s*(?:gramas?|g\b)/);
    const uni = frag.match(/(\d+(?:[.,]\d+)?)\s*(?:mudas?|pes?\b|plantas?|sementes?|covas?)/);

    if(d.tipo === "irrigacao"){
      if(min) d.duracao = n(min[1]);
      else if(hrs) d.duracao = Math.round(n(hrs[1])*60);
      if(lit) d.volume = n(lit[1]);
      for(const [re,v] of METODOS_RE) if(re.test(frag)){ d.metodo = v; break; }
    } else if(d.tipo === "insumo"){
      if(lit){ d.quantidade = n(lit[1]); d.unidade = "L"; }
      else if(kg){ d.quantidade = n(kg[1]); d.unidade = "kg"; }
      else if(gr){ d.quantidade = n(gr[1]); d.unidade = "g"; }
      for(const [re,v] of FORMAS_RE) if(re.test(frag)){ d.forma = v; break; }
    } else if(d.tipo === "plantio"){
      if(uni) d.quantidade = n(uni[1]);
      const cult = frag.match(/\b(?:plantei|plantamos|semeei|plantio\s+de)\s+(?:\d+\s+(?:mudas?|pes?|plantas?|sementes?|covas?)\s+(?:de\s+)?)?([a-z]{3,20})/);
      if(cult && !/^(na|no|nas|nos|em|uma?|dia)$/.test(cult[1]))
        d.cultura = cult[1].replace(/\b\w/, c => c.toUpperCase());
    } else if(d.tipo === "colheita"){
      if(kg){ d.quantidade = n(kg[1]); d.unidade = "kg"; }
      else if(gr){ d.quantidade = n(gr[1]); d.unidade = "g"; }
      else if(uni){ d.quantidade = n(uni[1]); d.unidade = "un"; }
    }

    const regra = frag.match(/\ba cada (\d+) (dias?|semanas?|mes(?:es)?)\b|\btod[oa]s? (?:os |as )?(dias?|semanas?|mes(?:es)?)\b|\bde (\d+) em \d+ dias?\b/);
    if(regra){
      d.regraDetectada = regra[0];
      d.regraDias = diasDaFrequencia(regra[0]);
    }
    /* sem verbo de ação, mas com frequência: é combinado, não registro.
       "neem na estufa 1 a cada 7 dias" não quer dizer que ele aplicou agora. */
    if(!acao && d.regraDias > 0) d.soCombinado = true;

    if(/\b(passa|passar|muda|mudar|mude|troca|trocar|altera|alterar)\b/.test(frag) && d.regraDias)
      d.alterarRegra = true;
    if(/\b(para|parar|pare|encerra|encerrar|cancela|cancelar|chega de|pode parar)\b/.test(frag) && !d.regraDias)
      d.encerrarRegra = true;

    if(d.tipo === "observacao") d.obs = falaOriginal.trim();
    drafts.push(d);
  });

  if(drafts.length > 1 && drafts.every(d => d.tipo === "observacao")) return [drafts[0]];
  return drafts;
}

/* ============ regras ============ */
/* Uma regra é o que DEVE acontecer, de quanto em quanto tempo.
   A próxima data não é guardada: é calculada a partir do último registro que casa
   com a regra. Assim a baixa é automática — você registra a aplicação e a próxima
   data anda sozinha, sem precisar marcar nada como feito. */

const idRegra = (areaId, tipo, insumoId) => "regra-" + areaId + "-" + tipo + (insumoId ? "-" + insumoId : "");

function regrasAtivas(){ return S.regras.filter(r => r.status !== "encerrada" && !r.pausadaAte); }

function casaComRegra(reg, r){
  return r.areaId === reg.areaId && r.tipo === reg.tipo &&
         (!reg.insumoId || r.insumoId === reg.insumoId);
}
function ultimaExecucao(reg){
  const datas = S.registros.filter(r => casaComRegra(reg, r)).map(r => r.data).sort();
  return datas.length ? datas[datas.length - 1] : null;
}
function proximaDe(reg){
  const base = ultimaExecucao(reg) || reg.desdeEm || (reg.criadoEm || "").slice(0, 10) || todayISO();
  return new Date(dayStart(base) + reg.frequencia * MS_DAY).toISOString().slice(0, 10);
}
/* >0 atrasada, 0 vence hoje, <0 ainda falta */
const atrasoDe = reg => daysAgo(proximaDe(reg));

function nomeDaRegra(reg){
  const a = areaById(reg.areaId);
  const i = reg.insumoId ? insumoById(reg.insumoId) : null;
  const oQue = i ? i.nome : TIPO_LB[reg.tipo];
  return oQue + (a ? " · " + a.nome : "");
}
const cadaQuantos = f => f === 1 ? "todo dia"
                      : f === 7 ? "toda semana"
                      : f % 7 === 0 ? "a cada " + (f/7) + " semanas"
                      : "a cada " + f + " dias";

async function salvarRegra(reg){
  reg.id = reg.id || idRegra(reg.areaId, reg.tipo, reg.insumoId);
  reg.status = reg.status || "ativa";
  reg.criadoEm = reg.criadoEm || new Date().toISOString();
  reg.historico = reg.historico || [];
  await put("regras", reg);
  const ix = S.regras.findIndex(x => x.id === reg.id);
  if(ix >= 0) S.regras[ix] = reg; else S.regras.push(reg);
  return reg;
}

/* a frequência de rega que o Rob já tinha posto nas áreas vira regra de verdade */
/* o campo de rega da área e o combinado de irrigação são a mesma coisa: mantém os dois juntos */
async function sincronizarRegraDeRega(a){
  const id = idRegra(a.id, "irrigacao");
  const ja = S.regras.find(r => r.id === id);
  if(a.frequencia > 0){
    if(ja && ja.frequencia === a.frequencia && ja.status === "ativa") return;
    const hist = (ja && ja.frequencia && ja.frequencia !== a.frequencia)
      ? (ja.historico || []).concat([{em: todayISO(), de: ja.frequencia, para: a.frequencia}])
      : (ja ? ja.historico : []);
    await salvarRegra(Object.assign({}, ja || {}, {
      id, areaId:a.id, tipo:"irrigacao", frequencia:a.frequencia,
      status:"ativa", desdeEm:(ja && ja.desdeEm) || todayISO(), historico: hist || []
    }));
  } else if(ja && ja.status !== "encerrada"){
    await salvarRegra(Object.assign({}, ja, {status:"encerrada"}));
  }
}

async function migrarFrequencias(){
  let n = 0;
  for(const a of S.areas){
    if(!(a.frequencia > 0)) continue;
    const id = idRegra(a.id, "irrigacao");
    if(S.regras.some(r => r.id === id)) continue;
    await salvarRegra({id, areaId:a.id, tipo:"irrigacao", frequencia:a.frequencia,
                       desdeEm: todayISO(), origem:"frequencia da área"});
    n++;
  }
  return n;
}

function tarefas(){
  return regrasAtivas().map(reg => ({reg, quando: proximaDe(reg), atraso: atrasoDe(reg)}))
                       .sort((x,y) => x.quando.localeCompare(y.quando));
}

/* ============ tela de confirmação ============ */
function telaConfirmar(texto, drafts, g, previasFixas){
  const w = el("div");
  const eb = errBox(); w.appendChild(eb);
  w.appendChild(el("div","fala-orig", "“" + esc(texto) + "”"));

  /* o combinado falado vira regra de verdade, mostrada à parte.
     Se ele falou SÓ o combinado (sem verbo de ação), nenhum registro é criado. */
  const comRegra = drafts.find(d => d.regraDias > 0);
  const soCombinado = !!(comRegra && comRegra.soCombinado);
  let previas = [];
  if(comRegra){
    const tipoR = comRegra.tipo === "observacao" ? "irrigacao" : comRegra.tipo;
    const alvos = (comRegra.areasCitadas && comRegra.areasCitadas.length)
      ? comRegra.areasCitadas : (comRegra.areaId ? [comRegra.areaId] : []);
    previas = alvos.map(areaId => {
      const id = idRegra(areaId, tipoR, comRegra.insumoId);
      const ja = S.regras.find(r => r.id === id && r.status !== "encerrada");
      return {id, areaId, tipo:tipoR, insumoId: comRegra.insumoId || null,
              frequencia: comRegra.regraDias, anterior: ja ? ja.frequencia : null};
    });
  }
  if(soCombinado) drafts = [];
  if(previasFixas) previas = previasFixas;

  const lista = el("div"); w.appendChild(lista);

  const voltar = () => telaConfirmar(texto, drafts, g, previas);

  function editar(ix){
    const d = drafts[ix];
    const pre = Object.assign({}, d, {
      aoSalvar: r => { drafts[ix] = Object.assign({}, r); voltar(); },
      aoCancelar: voltar
    });
    if(d.tipo === "irrigacao") formIrrigacao(pre);
    else if(d.tipo === "insumo") formInsumo(pre);
    else if(d.tipo === "poda") formPoda(pre);
    else if(d.tipo === "plantio") formPlantio(pre);
    else if(d.tipo === "colheita") formColheita(pre);
    else formObs(pre);
  }

  const cartoes = [];
  const falaNorm = normalizarFala(texto);

  function ensinarBotao(d, tipo, item, termos){
    const mj = melhorJanela(falaNorm, termos);
    if(!mj || mj.s >= 0.72 || mj.s < 0.3) return null;
    const b = el("button","ensinar");
    b.innerHTML = "Ensinar: “" + esc(mj.janela) + "” é " + esc(item.nome);
    b.onclick = async () => {
      item.apelidos = [...new Set((item.apelidos||[]).concat(mj.janela))];
      await put(tipo === "area" ? "areas" : "insumos", item);
      toast("Aprendido. Da próxima vez ele entende “" + mj.janela + "”.");
      b.remove();
    };
    return b;
  }

  function desenhar(){
    lista.innerHTML = "";
    cartoes.length = 0;
    drafts.forEach((d, ix) => {
      const c = el("div","card"); c.style.marginBottom = "12px";
      cartoes[ix] = c;
      const b = el("button","row");
      b.appendChild(el("div","dot d-" + d.tipo));
      const bd = el("div","bd");
      const a = d.areaId ? areaById(d.areaId) : null;
      bd.appendChild(el("div","t1", esc(TIPO_LB[d.tipo]) + (a ? " · " + esc(a.nome) : "")));
      const desc = descRegistro(d);
      if(desc) bd.appendChild(el("div","t2", esc(desc)));
      const faltas = [];
      if(!d.areaId && d.tipo !== "observacao") faltas.push("não entendi a área");
      if(d.tipo === "insumo" && !d.insumoId) faltas.push("não entendi o insumo");
      if(d.tipo === "plantio" && !d.cultura) faltas.push("falta a cultura");
      if(faltas.length) bd.appendChild(el("div","t2 falta", esc(faltas.join(" · "))));
      b.appendChild(bd);
      b.appendChild(el("div","rt","editar"));
      b.onclick = () => editar(ix);
      c.appendChild(b);

      if(!d.areaId && d.tipo !== "observacao"){
        const bloco = el("div","escolha");
        bloco.appendChild(el("div","sec-t","Toque na área certa"));
        const chips = el("div","chips");
        S.areas.forEach(ar => {
          const ch = el("button","chip", esc(ar.nome));
          ch.onclick = () => {
            drafts.forEach(x => { if(!x.areaId) x.areaId = ar.id; });
            d._ensinarArea = ar;
            desenhar();
          };
          chips.appendChild(ch);
        });
        bloco.appendChild(chips);
        c.appendChild(bloco);
      } else if(d._ensinarArea){
        const bt = ensinarBotao(d, "area", d._ensinarArea, termosDaArea(d._ensinarArea));
        if(bt){ const w2 = el("div"); w2.style.padding = "0 14px 12px"; w2.appendChild(bt); c.appendChild(w2); }
      }

      if(d.tipo === "insumo" && !d.insumoId){
        const bloco = el("div","escolha");
        bloco.appendChild(el("div","sec-t","Toque no insumo certo"));
        const chips = el("div","chips");
        S.insumos.forEach(i => {
          const ch = el("button","chip", esc(i.nome));
          ch.onclick = () => {
            d.insumoId = i.id;
            if(!d.unidade) d.unidade = i.unidade;
            d._ensinarIns = i;
            desenhar();
          };
          chips.appendChild(ch);
        });
        bloco.appendChild(chips);
        c.appendChild(bloco);
      } else if(d._ensinarIns){
        const bt = ensinarBotao(d, "insumo", d._ensinarIns, termosDoInsumo(d._ensinarIns));
        if(bt){ const w2 = el("div"); w2.style.padding = "0 14px 12px"; w2.appendChild(bt); c.appendChild(w2); }
      }

      if(drafts.length > 1){
        const acts = el("div","grav-acts"); acts.style.padding = "10px 14px 14px";
        const rm = el("button","mini d"); rm.textContent = "Remover";
        rm.onclick = () => { drafts.splice(ix,1); desenhar(); };
        acts.appendChild(rm); c.appendChild(acts);
      }
      lista.appendChild(c);
    });
  }
  desenhar();

  previas.forEach(prev => {
    const c = el("div","card"); c.style.cssText = "margin-bottom:12px;border-left:5px solid var(--green)";
    const bd = el("div"); bd.style.padding = "14px 16px";
    const a = areaById(prev.areaId);
    const i = prev.insumoId ? insumoById(prev.insumoId) : null;
    const oQue = i ? i.nome : TIPO_LB[prev.tipo];
    bd.appendChild(el("div","t1", prev.anterior ? "Mudar o combinado" : "Novo combinado"));
    bd.appendChild(el("div","t2", esc(oQue + " · " + (a ? a.nome : "") + " · " + cadaQuantos(prev.frequencia))));
    if(prev.anterior) bd.appendChild(el("div","t2 falta", "era " + cadaQuantos(prev.anterior)));
    const finge = {areaId:prev.areaId, tipo:prev.tipo, insumoId:prev.insumoId,
                   frequencia:prev.frequencia, desdeEm:todayISO(), criadoEm:new Date().toISOString()};
    bd.appendChild(el("div","t2", "próxima em " + fmtDay(proximaDe(finge))));
    c.appendChild(bd);
    const acts = el("div","grav-acts"); acts.style.padding = "0 14px 14px";
    const nao = el("button","mini d"); nao.textContent = "Não criar";
    nao.onclick = () => { previas = previas.filter(x => x.id !== prev.id); telaConfirmar(texto, drafts, g, previas); };
    acts.appendChild(nao); c.appendChild(acts);
    lista.appendChild(c);
  });

  const cobrar = (ix, msg) => {
    showErr(eb, msg);
    const c = cartoes[ix];
    if(c){ c.classList.add("pisca"); c.scrollIntoView({block:"center", behavior:"smooth"}); setTimeout(()=>c.classList.remove("pisca"), 2200); }
  };

  const salvar = async () => {
    if(!drafts.length && !previas.length) return showErr(eb, "Não sobrou nada pra salvar.");
    for(const prev of previas)
      if(!prev.areaId) return showErr(eb, "Falta a área do combinado.");
    for(let ix = 0; ix < drafts.length; ix++){
      const d = drafts[ix];
      if(d.tipo !== "observacao" && !d.areaId) return cobrar(ix, "Falta a área — toque num dos botões laranjas.");
      if(d.tipo === "insumo" && !d.insumoId) return cobrar(ix, "Falta o insumo — toque num dos botões laranjas.");
      if(d.tipo === "plantio" && !d.cultura) return cobrar(ix, "Falta dizer o que foi plantado — toque em “editar”.");
    }
    if(g){
      g.status = "processada";
      g.areaId = (drafts[0] && drafts[0].areaId) || null;
      await put("gravacoes", g);
    }

    for(const d of drafts){
      const r = Object.assign({}, d);
      Object.keys(r).forEach(k => { if(k[0] === "_") delete r[k]; });
      delete r.areaSugerida; delete r.insumoSugerido; delete r.areaConfianca;
      if(r.regraDetectada){ r.obs = ((r.obs ? r.obs + " · " : "") + "combinado: " + r.regraDetectada); delete r.regraDetectada; }
      delete r.regraDias; delete r.alterarRegra; delete r.encerrarRegra;
      r.id = uid(); r.gravacaoId = g ? g.id : null; r.fala = texto; r.criadoEm = new Date().toISOString();
      if(r.tipo === "plantio"){
        const p = {id:uid(), areaId:r.areaId, cultura:r.cultura, variedade:r.variedade||"",
                   dataPlantio:r.data, quantidade:r.quantidade||null, previsao:r.previsao||null,
                   status:"ativo", obs:r.obs||"", criadoEm:new Date().toISOString()};
        await put("plantios", p); S.plantios.push(p); r.plantioId = p.id;
      }
      await put("registros", r); S.registros.push(r);
      if(r.areaId) await saveCfg({ultimaArea:r.areaId, ultimoMetodo:r.metodo || S.config.ultimoMetodo});
    }
    for(const prev of previas){
      const antiga = S.regras.find(r => r.id === prev.id);
      const reg = antiga || {};
      const hist = (reg.historico || []).slice();
      if(antiga && antiga.frequencia !== prev.frequencia)
        hist.push({em: todayISO(), de: antiga.frequencia, para: prev.frequencia});
      await salvarRegra(Object.assign({}, reg, {
        id: prev.id, areaId: prev.areaId, tipo: prev.tipo, insumoId: prev.insumoId,
        frequencia: prev.frequencia, status: "ativa", pausadaAte: null,
        desdeEm: reg.desdeEm || todayISO(), historico: hist
      }));
    }
    closeSheet(); render();
    toast(previas.length
      ? (drafts.length ? "Salvo, e agora eu te cobro" : (previas.length === 1 ? "Combinado criado" : previas.length + " combinados criados"))
      : (drafts.length === 1 ? "Registrado" : drafts.length + " registros salvos"));
  };

  const descartar = () => confirmDel("Descartar o que você falou?", g ? "O áudio continua guardado em Gravações, mas nada entra no diário." : "Nada será salvo no diário.", async () => {
    closeSheet(); render(); toast("Descartado");
  });

  openSheet(soCombinado ? "Confira o combinado" : "Confira o que entendi", w,
    [btn("Descartar tudo","sec",descartar), btn("Salvar","pri",salvar)]);
}

let tab="home", stack=null;
function go(t){ tab=t; stack=null; render(); window.scrollTo(0,0); }
$("#backBtn").onclick=()=>{ stack=null; render(); };
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  go(b.dataset.tab);
});
function head(t,s){ $("#hdTitle").childNodes[0].nodeValue=t; $("#hdSub").textContent=s||""; }
function navBadge(){
  const b=document.querySelector('nav button[data-tab=agenda]');
  if(!b) return;
  const old=b.querySelector(".badge"); if(old) old.remove();
  const n=tarefas().filter(t => t.atraso >= 0).length;
  if(n) b.appendChild(el("span","badge",String(n)));
}

function render(){
  const v=$("#view"); v.innerHTML="";

  if(stack && stack.tipo==="area") return screenAreaDetalhe(stack.id);
  if(tab==="home") return screenHome();

  if(tab==="pend") return screenPendentes();
  if(tab==="diario") return screenDiario();

}

function screenAreaDetalhe(id){
  const a=areaById(id); if(!a){ stack=null; return render(); }
  head(a.nome,a.tipo||"");
  const v=$("#view");
  const hd=el("div","card"); hd.style.padding="4px 16px"; hd.style.marginBottom="18px";
  const kv=(k,val)=>{ const d=el("div","kv"); d.appendChild(el("span",null,esc(k))); d.appendChild(el("span",null,esc(val))); hd.appendChild(d); };
  const ui=ultimaIrrigacao(a.id);
  kv("Última irrigação", ui?fmtAgo(ui):"nenhuma registrada");
  if(a.frequencia){
    const atraso = ui? daysAgo(ui)-a.frequencia : null;
    kv("Combinado","a cada "+a.frequencia+" dias");
    kv("Situação", atraso==null?"sem registro": atraso>0?("atrasada "+atraso+(atraso===1?" dia":" dias")): atraso===0?"vence hoje":"em dia");
  }

  const rs=S.registros.filter(r=>r.areaId===a.id);
  kv("Registros",rs.length);
  if(a.apelidos&&a.apelidos.length) kv("Apelidos",a.apelidos.join(", "));
  if(a.obs) kv("Observação",a.obs);
  v.appendChild(hd);

  const fotos=rs.filter(r=>r.foto).sort((x,y)=>y.data.localeCompare(x.data));
  if(fotos.length){
    const s=el("div","sec"); s.appendChild(el("div","sec-t","Linha do tempo visual"));
    const strip=el("div"); strip.style.cssText="display:flex;gap:10px;overflow-x:auto;padding-bottom:6px";
    fotos.slice(0,20).forEach(r=>{
      const b=el("button"); b.style.cssText="flex:0 0 auto;text-align:center";
      const i=imgFrom(r.foto); i.style.cssText="width:104px;height:104px;object-fit:cover;border-radius:12px;display:block";
      b.appendChild(i); b.appendChild(el("div",null,esc(fmtDay(r.data)))).style.cssText="font-size:12.5px;color:var(--ink2);margin-top:5px";
      b.onclick=()=>verRegistro(r); strip.appendChild(b);
    });
    s.appendChild(strip); v.appendChild(s);

/* ============ sincronia ============ */
const SYNC_URL_PADRAO = "https://tmzirofxoghzfkrsvbit.supabase.co/functions/v1/sync";
const syncUrl = () => window.__syncUrl || SYNC_URL_PADRAO;

function novoCaderno(){
  const a = "abcdefghijklmnopqrstuvwxyz0123456789";
  let x = "";
  const buf = new Uint8Array(24);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(buf) : buf.forEach((_,i)=>buf[i]=i*7);
  for(const b of buf) x += a[b % a.length];
  return x;
}
const codigoBonito = c => (c||"").replace(/(.{6})/g, "$1 ").trim();

/* Ao ligar a sincronia, o que já está no aparelho precisa subir também.
   Sem isso, só viaja o que for tocado dali pra frente — e o diário antigo fica preso. */
async function marcarTudoPendente(){
  let n = 0;
  for(const loja of Object.keys(TIPO_DA_LOJA)){
    for(const o of (S[loja] || [])){
      if(!o.atualizadoEm){
        o.atualizadoEm = o.criadoEm || new Date().toISOString();
        await putBruto(loja, o);
      }
      await marcarPendente(loja, o.id, false, o.atualizadoEm);
      n++;
    }
  }
  return n;
}

let sincronizando = false, timerSync = null;
function agendarSync(){
  if(!S.config.caderno) return;
  clearTimeout(timerSync);
  timerSync = setTimeout(() => sincronizar(true), 4000);
}

async function sincronizar(silencioso){
  if(sincronizando || !S.config.caderno) return;
  if(!navigator.onLine){ if(!silencioso) toast("Sem internet agora. Vai sincronizar quando voltar."); return; }
  sincronizando = true;
  if(!silencioso) toast("Sincronizando…");
  try{
    const pend = S.pendentes.slice();
    const mudancas = [];
    for(const p of pend){
      if(p.apagado){ mudancas.push({id:p.oid, tipo:p.tipo, dados:null, apagado:true, atualizadoEm:p.atualizadoEm}); continue; }
      let obj = (S[p.loja] || []).find(x => x.id === p.oid);
      if(!obj){
        /* não está na memória: busca no banco antes de desistir, pra não sumir com a mudança */
        obj = (await all(p.loja)).find(x => x.id === p.oid);
        if(!obj) continue;
      }
      const dados = Object.assign({}, obj);
      delete dados.foto;                         /* foto não viaja: fica no aparelho */
      mudancas.push({id:obj.id, tipo:p.tipo, dados, apagado:false, atualizadoEm:obj.atualizadoEm || p.atualizadoEm});
    }

    const res = await fetch(syncUrl(), {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({caderno:S.config.caderno, desde:S.config.syncEm || null, mudancas})
    });
    if(!res.ok) throw new Error("servidor respondeu " + res.status);
    const j = await res.json();
    if(j.erro) throw new Error(j.erro);

    let recebidas = 0;
    for(const m of (j.mudancas || [])){
      const loja = LOJA_DO_TIPO[m.tipo]; if(!loja) continue;
      const local = (S[loja] || []).find(x => x.id === m.id);
      if(m.apagado){
        if(local){ await delBruto(loja, m.id); S[loja] = S[loja].filter(x => x.id !== m.id); recebidas++; }
        continue;
      }
      if(!m.dados) continue;
      if(local && local.atualizadoEm && local.atualizadoEm >= m.atualizadoEm) continue;
      const novo = Object.assign({}, m.dados, {atualizadoEm: m.atualizadoEm});
      if(local && local.foto) novo.foto = local.foto;
      await putBruto(loja, novo);
      const ix = S[loja].findIndex(x => x.id === m.id);
      if(ix >= 0) S[loja][ix] = novo; else S[loja].push(novo);
      recebidas++;
    }

    for(const p of pend){
      const atual = S.pendentes.find(x => x.id === p.id);
      if(atual && atual.atualizadoEm === p.atualizadoEm) await delBruto("pendentes", p.id);
    }
    S.pendentes = await all("pendentes");
    await saveCfg({syncEm: j.agora, syncQuando: new Date().toISOString()});
    render();
    if(!silencioso) toast(mudancas.length || recebidas
      ? "Pronto · enviei " + mudancas.length + ", recebi " + recebidas
      : "Já estava tudo sincronizado");
    return {enviadas: mudancas.length, recebidas};
  }catch(e){
    console.error("sync", e);
    if(!silencioso) toast("Não consegui sincronizar: " + e.message);
  }finally{ sincronizando = false; }
}

    b2.style.marginTop = "10px"; b2.style.flex = "1"; v.appendChild(b2);
  }

  const vt = btn("← Voltar","sec",()=>go("mais")); vt.style.marginTop = "18px"; vt.style.flex = "1"; v.appendChild(vt);
}

/* ============ backup ============ */
function semBlobs(r){ const o=Object.assign({},r); delete o.foto; return o; }
function exportar(){
  const data={versao:2,exportadoEm:new Date().toISOString(),areas:S.areas,insumos:S.insumos,
              plantios:S.plantios,registros:S.registros.map(semBlobs),config:S.config};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download="caderno-campo-"+todayISO()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  toast("Backup gerado (sem áudios e fotos)");
}
function importar(){
  const f=document.createElement("input"); f.type="file"; f.accept=".json,application/json";
  f.onchange=async()=>{
    const file=f.files[0]; if(!file) return;
    try{
      const d=JSON.parse(await file.text());
      if(!d||!Array.isArray(d.registros)) throw new Error("formato");
      for(const s of ["areas","insumos","plantios","registros"]){
        await clearStore(s); for(const o of (d[s]||[])) await put(s,o);
      }
      if(d.config) await put("config",Object.assign({id:"app"},d.config));
      await load(); render(); toast("Backup restaurado");
    }catch(e){ toast("Arquivo inválido"); }
  };
  f.click();
}
function apagarTudo(){
  confirmDel("Apagar tudo?","Registros, áreas, insumos, áudios e fotos deste aparelho serão apagados. Exporte um backup antes se quiser guardar.",async()=>{
    for(const s of STORES) await clearStore(s);
    await load(); closeSheet(); go("home"); toast("Tudo apagado");
  });
}
async function exemplos(){
  if(S.areas.length||S.registros.length||S.gravacoes.length)
    confirmDel("Carregar dados de exemplo?","Isso apaga o que já existe neste aparelho e coloca dados fictícios pra você experimentar.",doIt);
  else doIt();
  async function doIt(){
    for(const s of STORES) await clearStore(s);
    const d=i=>new Date(Date.now()-i*MS_DAY).toISOString().slice(0,10);
    const areas=[
      {id:"a1",nome:"Estufa 1",tipo:"Estufa",frequencia:2,apelidos:["estufa um","estufa de cima"],obs:"",criadoEm:new Date().toISOString()},
      {id:"a2",nome:"Canteiro 3",tipo:"Canteiro",frequencia:4,apelidos:["canteiro três"],obs:"",criadoEm:new Date().toISOString()},
      {id:"a3",nome:"Linha 3 — jaqueiras",tipo:"Linha",frequencia:7,apelidos:["linha três","a jaca da linha três"],obs:"",criadoEm:new Date().toISOString()}
    ];
    const insumos=[
      {id:"i1",nome:"Chorume",tipo:"Biofertilizante",unidade:"L",carencia:null,obs:"",criadoEm:new Date().toISOString()},
      {id:"i2",nome:"Bokashi",tipo:"Adubo",unidade:"kg",carencia:null,obs:"",criadoEm:new Date().toISOString()},
      {id:"i3",nome:"Calda bordalesa",tipo:"Defensivo",unidade:"L",carencia:7,obs:"",criadoEm:new Date().toISOString()}
    ];
    const plantios=[
      {id:"p1",areaId:"a1",cultura:"Alface",variedade:"Crespa",dataPlantio:d(22),quantidade:120,previsao:d(-18),status:"ativo",obs:"",criadoEm:new Date().toISOString()},
      {id:"p2",areaId:"a2",cultura:"Tomate",variedade:"Cereja",dataPlantio:d(46),quantidade:40,previsao:d(-25),status:"ativo",obs:"",criadoEm:new Date().toISOString()}
    ];
    const R=[]; const add=o=>R.push(Object.assign({id:uid(),hora:"07:30",criadoEm:new Date().toISOString()},o));
    [0,2,4,6,9,12,15].forEach(n=>add({tipo:"irrigacao",areaId:"a1",data:d(n),metodo:"Gotejo",duracao:30}));
    [1,5,8,13].forEach(n=>add({tipo:"irrigacao",areaId:"a2",data:d(n),metodo:"Aspersão",duracao:20}));
    [11].forEach(n=>add({tipo:"irrigacao",areaId:"a3",data:d(n),metodo:"Mangueira",volume:60}));
    add({tipo:"insumo",areaId:"a3",insumoId:"i1",quantidade:5,unidade:"L",forma:"No solo",data:d(2),obs:"primeira aplicação de chorume"});
    add({tipo:"insumo",areaId:"a1",insumoId:"i2",quantidade:2,unidade:"kg",forma:"Cobertura",data:d(10)});
    add({tipo:"insumo",areaId:"a2",insumoId:"i3",quantidade:1.5,unidade:"L",forma:"Foliar",data:d(4),obs:"pintas nas folhas de baixo"});
    add({tipo:"plantio",areaId:"a1",plantioId:"p1",cultura:"Alface",variedade:"Crespa",quantidade:120,data:d(22)});
    add({tipo:"plantio",areaId:"a2",plantioId:"p2",cultura:"Tomate",variedade:"Cereja",quantidade:40,data:d(46)});
    add({tipo:"observacao",areaId:"a3",data:d(1),obs:"jaca da ponta com folha amarelada, as outras normais"});
    add({tipo:"observacao",areaId:"a1",data:d(7),obs:"muito calor essa semana, solo secando rápido"});
    add({tipo:"colheita",areaId:"a2",quantidade:6,unidade:"kg",data:d(3),obs:"primeira colhida"});
    for(const a of areas) await put("areas",a);
    for(const i of insumos) await put("insumos",i);
    for(const p of plantios) await put("plantios",p);
    for(const r of R) await put("registros",r);
    await put("config",{id:"app",ultimaArea:"a1"});
    await load(); closeSheet(); go("home"); toast("Dados de exemplo carregados");
  }
}

/* ============ boot ============ */
(async function(){
  try{
    await open(); await load();
    if(S.config.vocab !== VOCAB_VERSAO){          /* instala uma vez, mesmo já tendo registros */
      await juntarDuplicatas();
      await canonizarIds();
      await instalarVocabulario();
      await repararOrfaos();
      await migrarFrequencias();
      await saveCfg({vocab: VOCAB_VERSAO});
      await load();
    }
    render();
    if(S.config.caderno){
      sincronizar(true);
      window.addEventListener("online", () => sincronizar(true));
      setInterval(() => sincronizar(true), 5*60*1000);
    }
  }
  catch(e){
    $("#view").innerHTML='<div class="empty"><b>Não consegui abrir o banco de dados.</b><br>Se você estiver numa aba anônima, tente numa aba normal.</div>';
    console.error(e);
  }
})();
window.__app={S,load,render,statusGeral,interpretar,telaConfirmar,numerosParaDigitos,sincronizar,novoCaderno,saveCfg,put,del,marcarTudoPendente,canonizarIds,repararOrfaos,juntarDuplicatas,tarefas,proximaDe,salvarRegra,migrarFrequencias,diasDaFrequencia,normalizarFala,fragmentar};

if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(e=>console.warn("sw",e)); });
}
