/* ---- compromissos ordenados ---- */
function compromissos(){
  return S.notas.filter(function(n){ return n.tipo === "compromisso"; })
    .sort(function(a, b){
      var x = (a.data || "") + (a.hora || "99:99");
      var y = (b.data || "") + (b.hora || "99:99");
      return x < y ? -1 : x > y ? 1 : 0;
    });
}
/* repetição semanal: mostra a próxima ocorrência a partir de hoje */
function ocorrenciaEm(n, iso){
  if(!n.repete) return n.data === iso;
  if(n.repete === "diario") return iso >= n.data;
  return iso >= n.data && diaSemana(iso) === n.diaRepete;
}
function doDia(iso){
  return compromissos().filter(function(n){ return ocorrenciaEm(n, iso); });
}

function telaHoje(){
  var hoje = todayISO();
  cabecalho(L.hoje, fmtDataLonga(hoje), SVG_SOL);
  var v = el("div");

  /* --- o arco: o próximo compromisso --- */
  var prox = null;
  for(var k = 0; k < 8 && !prox; k++){
    var iso = somarDias(hoje, k);
    var lista = doDia(iso).filter(function(n){
      if(iso > hoje) return true;
      var m = minutosAte(iso, n.hora);
      return m === null || m > -30;
    });
    if(lista.length) prox = {n:lista[0], iso:iso};
  }
  var arco = el("div", "arco" + (prox ? "" : " calmo"));
  if(prox){
    var min = minutosAte(prox.iso, prox.n.hora);
    var quando = (min !== null && fmtDaqui(min)) || fmtDia(prox.iso);
    arco.innerHTML =
      '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--terracota)" stroke-width="1.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.4V12l3.1 1.9"/></svg>' +
      '<div class="quando">' + esc(quando) + "</div>" +
      '<div class="oque serif">' + esc(prox.n.texto) + "</div>" +
      '<div class="hora num">' + esc(prox.n.hora || "") + "</div>";
  } else {
    arco.innerHTML =
      '<svg width="42" height="30" viewBox="0 0 42 30" fill="none" stroke="var(--ocre)" stroke-width="1.15" stroke-linecap="round">' +
      '<path d="M9 24a12 12 0 0 1 24 0"/><path d="M14 24a7 7 0 0 1 14 0"/>' +
      '<path d="M21 3v4M6 12l2.4 2.4M36 12l-2.4 2.4M2 24h5M35 24h5"/></svg>' +
      '<div class="oque serif">אין כלום בקרוב</div>';
  }
  v.appendChild(arco);
  v.appendChild(el("div", "franja"));
  v.appendChild(blocoMic());

  /* --- atalho de sonho: um toque, sem escolher nada --- */
  var atalhos = el("div", "chips");
  atalhos.style.justifyContent = "center";
  var bs = el("button", "chip", "חלמתי…");
  bs.onclick = function(){ aba = "notas"; subAba = "sonhos"; render(); setTimeout(alternarFala, 120); };
  atalhos.appendChild(bs);
  var bw = el("button", "chip" + (subAba === "semana" ? " on" : ""), L.semana);
  bw.onclick = function(){ subAba = (subAba === "semana" ? "" : "semana"); render(); };
  atalhos.appendChild(bw);
  v.appendChild(atalhos);

  if(subAba === "semana"){
    /* a semana começa no DOMINGO */
    var ini = somarDias(hoje, -diaSemana(hoje));
    for(var i = 0; i < 7; i++){
      var d = somarDias(ini, i);
      var itens = doDia(d);
      v.appendChild(el("div", "tecido",
        "<span>" + esc(DIA_NOME[diaSemana(d)] + " · " + fmtDiaCurto(d)) + "</span><i></i>"));
      if(!itens.length){ v.appendChild(el("div", "vazio", "—")); continue; }
      itens.forEach(function(n){ v.appendChild(linhaCompromisso(n, d)); });
    }
  } else {
    v.appendChild(el("div", "tecido", "<span>" + esc(L.hoje) + "</span><i></i>"));
    var ah = doDia(hoje);
    if(!ah.length) v.appendChild(el("div", "vazio", "אין כלום היום"));
    ah.forEach(function(n){ v.appendChild(linhaCompromisso(n, hoje)); });

    var am = somarDias(hoje, 1), lam = doDia(am);
    if(lam.length){
      v.appendChild(el("div", "tecido", "<span>" + esc(L.amanha) + "</span><i></i>"));
      lam.forEach(function(n){ v.appendChild(linhaCompromisso(n, am)); });
    }
  }
  return v;
}

function linhaCompromisso(n, iso){
  var b = el("button", "item");
  var min = minutosAte(iso, n.hora);
  if(min !== null && min <= 0) b.classList.add("feito");
  else if(min !== null && min < 60) b.classList.add("agora");
  b.appendChild(el("div", "p"));
  b.appendChild(el("div", "h num", esc(n.hora || "—")));
  b.appendChild(el("div", "t", esc(n.texto) +
    (n.repete ? '<small>חוזר</small>' : "")));
  b.onclick = function(){ verNota(n); };
  return b;
}

/* ---------- רשומות: sonhos e ideias ---------- */
function telaNotas(){
  var quais = subAba === "ideias" ? "ideias" : "sonhos";
  var g = grupoChave(quais);
  cabecalho(g ? g.nome : "", "", quais === "sonhos" ? SVG_LUA : SVG_SOL);
  var v = el("div");

  var chips = el("div", "chips");
  [["sonhos", grupoChave("sonhos")], ["ideias", grupoChave("ideias")]].forEach(function(par){
    if(!par[1]) return;
    var c = el("button", "chip" + (quais === par[0] ? " on" : ""), esc(par[1].nome));
    c.onclick = function(){ subAba = par[0]; render(); };
    chips.appendChild(c);
  });
  v.appendChild(chips);

  v.appendChild(blocoMic());

  /* Busca em texto completo. O valor de um diário de sonhos aparece meses
     depois, quando ela procura "סבתא" e acha sete. */
  var busca = entrada("search", S.config["busca_" + quais] || "");
  busca.placeholder = "חיפוש";
  busca.oninput = function(){
    S.config["busca_" + quais] = busca.value;
    desenharLista();
  };
  var fb = el("div", "f"); fb.appendChild(busca);
  v.appendChild(fb);

  var alvo = el("div");
  v.appendChild(alvo);

  function desenharLista(){
    alvo.innerHTML = "";
    var q = normHe(String(S.config["busca_" + quais] || "").trim());
    var lista = S.notas.filter(function(n){
      return n.tipo === "nota" && g && n.grupoId === g.id &&
        (!q || normHe(n.texto || "").indexOf(q) >= 0);
    }).sort(function(a, b){ return (b.data || "") < (a.data || "") ? -1 : 1; });

    if(!lista.length){
      alvo.appendChild(el("div", "vazio", q
        ? "אין תוצאות"
        : "עוד אין כלום כאן"));
      return;
    }
    lista.forEach(function(n){
      var b = el("button", "item");
      b.appendChild(el("div", "t",
        '<span class="serif">' + esc(n.texto) + "</span><small>" +
        esc(n.noite ? fmtNoite(n.data) : fmtDia(n.data)) + "</small>"));
      b.onclick = function(){ verNota(n); };
      alvo.appendChild(b);
    });
  }
  desenharLista();
  return v;
}

/* ---------- קניות: uma lista só ---------- */
function telaCompras(){
  var g = grupoChave("compras");
  cabecalho(g ? g.nome : "", "", SVG_CESTA);
  var v = el("div");
  v.appendChild(blocoMic());

  var lista = S.notas.filter(function(n){ return n.tipo === "compra" && !n.arquivado; });
  var aComprar = lista.filter(function(n){ return !n.comprado; });
  var jaComprado = lista.filter(function(n){ return n.comprado; });

  function linha(n){
    var b = el("button", "item" + (n.comprado ? " feito" : ""));
    b.appendChild(el("div", "p"));
    b.appendChild(el("div", "t", esc(n.item) +
      (n.qtd ? ' <small class="num">' + esc(fmtNum(n.qtd) + (n.unidade ? " " + n.unidade : "")) + "</small>" : "")));
    /* marcar como comprado é um toque na linha inteira — ela vai fazer isso
       com uma mão, empurrando carrinho */
    b.onclick = async function(){
      n.comprado = !n.comprado;
      await put("notas", n);
      render();
    };
    return b;
  }

  v.appendChild(el("div", "tecido", "<span>לקנות</span><i></i>"));
  if(!aComprar.length) v.appendChild(el("div", "vazio", "הרשימה ריקה"));
  aComprar.forEach(function(n){ v.appendChild(linha(n)); });

  if(jaComprado.length){
    v.appendChild(el("div", "tecido", "<span>נקנה</span><i></i>"));
    jaComprado.forEach(function(n){ v.appendChild(linha(n)); });

    /* sem isto a lista vira lixo em duas semanas */
    var fim = el("div", "linha-btn");
    fim.style.marginTop = "16px";
    fim.appendChild(botao("סיימתי קנייה", "pri", async function(){
      for(var i = 0; i < jaComprado.length; i++){
        jaComprado[i].arquivado = true;
        await put("notas", jaComprado[i]);
      }
      render();
      /* Lista é intenção, gasto é fato. O valor ela só sabe no caixa —
         então perguntamos, nunca inventamos. */
      perguntarGasto();
    }));
    v.appendChild(fim);
  }

  /* os de sempre: economiza mais fala que qualquer reconhecimento bom */
  var usuais = S.itens.filter(function(it){ return (it.usos || 0) > 0; })
    .sort(function(a, b){ return (b.usos || 0) - (a.usos || 0); })
    .filter(function(it){
      /* nem o que falta comprar, nem o que já foi posto no carrinho hoje */
      return !lista.some(function(n){ return normHe(n.item) === normHe(it.nome); });
    }).slice(0, 10);
  if(usuais.length){
    v.appendChild(el("div", "tecido", "<span>הרגילים</span><i></i>"));
    var ch = el("div", "chips");
    usuais.forEach(function(it){
      var c = el("button", "chip", "+ " + esc(it.nome));
      c.onclick = async function(){
        var r = {id:uid(), tipo:"compra", grupoId:g.id, item:it.nome, qtd:null,
                 unidade:null, comprado:false, criadoEm:new Date().toISOString()};
        await put("notas", r); S.notas.push(r);
        await lembrarItem(it.nome);
        render();
      };
      ch.appendChild(c);
    });
    v.appendChild(ch);
  }
  return v;
}

function perguntarGasto(){
  var gd = grupoChave("dinheiro");
  if(!gd) return;
  var iv = entrada("number", "");
  iv.step = "0.01";
  var w = el("div");
  w.appendChild(campo("כמה שילמת?", iv,
    "אפשר לדלג — הרשימה לא רושמת כסף לבד"));
  abrirFolha("קנייה הסתיימה", w, [
    botao("דלג", "", fecharFolha),
    botao("רישום", "pri", async function(){
      var val = parseFloat(iv.value);
      if(isNaN(val)){ fecharFolha(); return; }
      var r = {id:uid(), tipo:"gasto", grupoId:gd.id, valor:val, direcao:"saiu",
               onde:"קניות", data:todayISO(), criadoEm:new Date().toISOString()};
      await put("notas", r); S.notas.push(r);
      fecharFolha(); render();
      toast("נרשם");
    })
  ]);
}

/* ---------- כספים: o mês ---------- */
function telaDinheiro(){
  var g = grupoChave("dinheiro");
  var mes = S.config.mes || todayISO().slice(0, 7);
  var pm = mes.split("-").map(Number);
  cabecalho(g ? g.nome : "", MES_NOME[pm[1]-1] + " " + pm[0], SVG_CIFRA);
  var v = el("div");

  var nav = el("div", "mesnav");
  /* Em RTL a leitura corre da direita pra esquerda: VOLTAR fica à direita,
     AVANÇAR à esquerda. O primeiro filho do flex é o da direita. */
  var bAnt = el("button"); bAnt.innerHTML = "›";        /* volta um mês */
  bAnt.onclick = function(){ S.config.mes = mesSomar(mes, -1); render(); };
  var bProx = el("button"); bProx.innerHTML = "‹";      /* avança um mês */
  bProx.onclick = function(){ S.config.mes = mesSomar(mes, 1); render(); };
  var rot = el("div", "serif", esc(MES_NOME[pm[1]-1] + " " + pm[0]));
  rot.style.fontSize = "18px";
  nav.appendChild(bAnt); nav.appendChild(rot); nav.appendChild(bProx);
  v.appendChild(nav);

  var lista = S.notas.filter(function(n){
    return n.tipo === "gasto" && String(n.data || "").slice(0, 7) === mes;
  }).sort(function(a, b){ return (b.data || "") < (a.data || "") ? -1 : 1; });

  var entrou = 0, saiu = 0;
  lista.forEach(function(n){
    if(n.direcao === "entrou") entrou += (n.valor || 0); else saiu += (n.valor || 0);
  });

  var tiles = el("div", "tiles");
  tiles.innerHTML =
    '<div class="tile"><div class="r">נכנס</div><div class="v serif num e">' + shekel(entrou) + "</div></div>" +
    '<div class="tile saldo"><div class="r">מאזן</div><div class="v serif num">' + shekel(entrou - saiu) + "</div></div>" +
    '<div class="tile"><div class="r">יצא</div><div class="v serif num s">' + shekel(saiu) + "</div></div>";
  v.appendChild(tiles);

  v.appendChild(blocoMic());

  if(!lista.length){
    v.appendChild(el("div", "vazio", "אין תנועות בחודש הזה"));
  } else {
    var diaAtual = null;
    lista.forEach(function(n){
      if(n.data !== diaAtual){
        diaAtual = n.data;
        v.appendChild(el("div", "tecido", "<span>" + esc(fmtDia(n.data)) + "</span><i></i>"));
      }
      var b = el("button", "lanc");
      var ent = n.direcao === "entrou";
      b.appendChild(el("div", "seta " + (ent ? "e" : "s"), ent ? "↑" : "↓"));
      b.appendChild(el("div", "onde", esc(n.onde || (grupoPor(n.grupoId) || {}).nome || "")));
      b.appendChild(el("div", "val num" + (ent ? " e" : ""), shekel(n.valor)));
      b.onclick = function(){ verNota(n); };
      v.appendChild(b);
    });

    /* quebra por lugar */
    var porOnde = {};
    lista.forEach(function(n){
      if(n.direcao === "entrou") return;
      var chave = normHe(n.onde || "—");
      if(!porOnde[chave]) porOnde[chave] = {nome:n.onde || "—", total:0};
      porOnde[chave].total += (n.valor || 0);
    });
    var arr = Object.keys(porOnde).map(function(k){ return porOnde[k]; })
      .sort(function(a, b){ return b.total - a.total; }).slice(0, 6);
    if(arr.length){
      v.appendChild(el("div", "tecido", "<span>לפי מקום</span><i></i>"));
      var maior = arr[0].total || 1;
      arr.forEach(function(x){
        var bb = el("div", "barra");
        bb.innerHTML = '<div class="l"><span>' + esc(x.nome) + '</span><b class="num">' + shekel(x.total) + "</b></div>" +
          '<div class="g"><i style="width:' + Math.round(x.total / maior * 100) + '%"></i></div>';
        v.appendChild(bb);
      });
    }
  }
  return v;
}
function mesSomar(mes, n){
  var p = mes.split("-").map(Number);
  var d = new Date(p[0], p[1] - 1 + n, 1);
  return d.getFullYear() + "-" + p2(d.getMonth() + 1);
}

/* ---------- עוד ---------- */
function telaMais(){
  cabecalho("עוד", "", "");
  var v = el("div");

  var c1 = el("div", "card");
  c1.appendChild(el("h3", "serif", "קבוצות"));
  var ch = el("div", "chips");
  S.grupos.forEach(function(g){ ch.appendChild(el("span", "chip", esc(g.nome))); });
  c1.appendChild(ch);
  v.appendChild(c1);

  /* A regra de ambiguidade escrita na tela — o documento manda escolher uma,
     escrever, e não mudar. */
  var c2 = el("div", "card");
  c2.appendChild(el("h3", "serif", "איך אני מבין תאריכים"));
  c2.appendChild(el("p", null,
    "“יום שלישי” — תמיד הפעם הקרובה הבאה.<br>" +
    "“בשלוש” — 15:00. מספר בין 1 ל-7 הוא אחר הצהריים.<br>" +
    "השבוע מתחיל ביום ראשון."));
  v.appendChild(c2);

  /* Honestidade que o documento exige: o app NÃO toca alarme. */
  var c3 = el("div", "card");
  c3.appendChild(el("h3", "serif", "תזכורות"));
  c3.appendChild(el("p", null,
    "האפליקציה מראה מה קרוב, אבל <b>לא מצלצלת</b> כשהיא סגורה. זה יגיע בשלב הבא."));
  v.appendChild(c3);

  var c4 = el("div", "card");
  c4.appendChild(el("h3", "serif", "גיבוי"));
  var lb = el("div", "linha-btn");
  lb.appendChild(botao("יצוא", "", exportar));
  lb.appendChild(botao("יבוא", "", importar));
  c4.appendChild(lb);
  c4.appendChild(el("div", "dica",
    "הכל נשמר רק במכשיר הזה. סנכרון מוצפן יגיע בשלב הבא."));
  v.appendChild(c4);

  var c5 = el("div", "card");
  var bt = botao("מצב לילה / יום", "", async function(){
    var n = !(S.config.noite);
    await salvarCfg({noite:n, noiteAuto:false});
    aplicarTema(); render();
  });
  c5.appendChild(bt);
  v.appendChild(c5);
  return v;
}

function verNota(n){
  var w = el("div");
  var g = grupoPor(n.grupoId);
  if(n.fala) w.appendChild(el("div", "fala-orig", "“" + esc(n.fala) + "”"));

  if(n.tipo === "compromisso"){
    var it = entrada("text", n.texto); w.appendChild(campo("מה", it));
    var idt = entrada("date", n.data); w.appendChild(campo("מתי", idt));
    var ihr = entrada("time", n.hora || ""); w.appendChild(campo("שעה", ihr));
    var salvarFn = async function(){
      n.texto = it.value; n.data = idt.value; n.hora = ihr.value;
      await put("notas", n); fecharFolha(); render(); toast("עודכן");
    };
    abrirFolha(g ? g.nome : "", w, [rodapeApagar(n), botao("שמירה", "pri", salvarFn)]);
    return;
  }
  if(n.tipo === "gasto"){
    var iv = entrada("number", n.valor); iv.step = "0.01";
    w.appendChild(campo("סכום", iv));
    var io = entrada("text", n.onde || "");
    w.appendChild(campo("איפה / ממי", io));
    var idd = entrada("date", n.data); w.appendChild(campo("מתי", idd));
    abrirFolha(g ? g.nome : "", w, [rodapeApagar(n), botao("שמירה", "pri", async function(){
      n.valor = parseFloat(iv.value); n.onde = io.value; n.data = idd.value;
      await put("notas", n); fecharFolha(); render(); toast("עודכן");
    })]);
    return;
  }
  var ta = el("textarea"); ta.value = n.texto || "";
  w.appendChild(campo(n.noite ? fmtNoite(n.data) : fmtDia(n.data), ta));
  abrirFolha(g ? g.nome : "", w, [rodapeApagar(n), botao("שמירה", "pri", async function(){
    n.texto = ta.value;
    await put("notas", n); fecharFolha(); render(); toast("עודכן");
  })]);
}

function rodapeApagar(n){
  return botao("מחיקה", "dng", async function(){
    await del("notas", n.id);
    S.notas = S.notas.filter(function(x){ return x.id !== n.id; });
    fecharFolha(); render(); toast("נמחק");
  });
}

/* ---------- backup ---------- */
function exportar(){
  var dados = {versao:1, quando:new Date().toISOString(),
    grupos:S.grupos, notas:S.notas, lugares:S.lugares, itens:S.itens};
  var b = new Blob([JSON.stringify(dados, null, 1)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "maya-" + todayISO() + ".json";
  a.click();
}
function importar(){
  var i = document.createElement("input");
  i.type = "file"; i.accept = "application/json,.json";
  i.onchange = async function(){
    var f = i.files[0]; if(!f) return;
    try {
      var d = JSON.parse(await f.text());
      var lojas = ["grupos","notas","lugares","itens"];
      for(var k = 0; k < lojas.length; k++){
        var arr = d[lojas[k]] || [];
        for(var j = 0; j < arr.length; j++) await put(lojas[k], arr[j]);
      }
      await carregar(); render();
      toast("יובא");
    } catch(e){ toast("הקובץ לא תקין"); }
  };
  i.click();
}

/* ==========================================================================
   TEMA — a noite não é outro tema, é o mesmo app depois do pôr do sol.
   A tela de sonhos abre escura de madrugada, sem perguntar.
   ========================================================================== */
function aplicarTema(){
  var h = new Date().getHours();
  var auto = (S.config.noiteAuto !== false);
  var noite = auto ? (h >= 20 || h < 7) : !!S.config.noite;
  if(aba === "notas" && subAba === "sonhos" && (h >= 20 || h < 9)) noite = true;
  document.documentElement.classList.toggle("noite", noite);
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", noite ? "#1C1714" : "#F6EFE4");
}

/* ==========================================================================
   NAVEGAÇÃO E DESENHO
   ========================================================================== */
var ABAS = [
  {k:"hoje",    r:"היום"},
  {k:"notas",   r:"רשומות"},
  {k:"compras", r:"קניות"},
  {k:"dinheiro",r:"כספים"},
  {k:"mais",    r:"עוד"}
];
function desenharNav(){
  var n = $("#nav"); n.innerHTML = "";
  ABAS.forEach(function(a){
    var b = el("button", aba === a.k ? "on" : "");
    b.appendChild(el("div", "pt"));
    b.appendChild(el("div", null, esc(a.r)));
    b.onclick = function(){ irPara(a.k); };
    n.appendChild(b);
  });
}

function render(){
  aplicarTema();
  desenharNav();
  var v = $("#view");
  v.innerHTML = "";
  var tela =
    aba === "notas"    ? telaNotas() :
    aba === "compras"  ? telaCompras() :
    aba === "dinheiro" ? telaDinheiro() :
    aba === "mais"     ? telaMais() : telaHoje();
  v.appendChild(tela);
  v.appendChild(el("div", "rodape-boho"));
}

async function carregar(){
  S.grupos  = await todos("grupos");
  S.notas   = await todos("notas");
  S.lugares = await todos("lugares");
  S.itens   = await todos("itens");
  var cfg = await todos("config");
  S.config = cfg[0] || {id:"app"};
  S.grupos.sort(function(a, b){ return (a.ordem || 9) - (b.ordem || 9); });
}

(async function inicio(){
  try {
    await abrirDB();
    await carregar();
    await semear();
    await carregar();
  } catch(e){
    console.error(e);
    document.body.innerHTML = '<div style="padding:40px;text-align:center">' +
      'לא הצלחתי לפתוח את המידע.</div>';
    return;
  }
  render();
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
  /* deixa o app testável sem microfone */
  window.__falar = function(t){ confirmar(t); };
})();
</script>
